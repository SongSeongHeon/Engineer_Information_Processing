<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정처기 실기 기출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --card:#FFFFFF; --ink:#172033; --muted:#6A7589; --line:#E4E8F0; --soft:#F0F3F8;
  --primary:#2F5BEA; --primary-d:#2449C7; --primary-soft:#E9EEFF;
  --ok:#12A150; --ok-soft:#E3F6EB; --bad:#E5484D; --bad-soft:#FDECEC; --amber:#F2A900; --amber-soft:#FFF3CC;
  --code-bg:#0F1B2E; --code-ink:#E6EDF7;
  --r:14px; --shadow:0 1px 2px rgba(23,32,51,.05),0 6px 18px rgba(23,32,51,.05);
  --sans:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Nanum Gothic",system-ui,sans-serif;
  --mono:"D2Coding","JetBrains Mono","SF Mono",Consolas,"Malgun Gothic","맑은 고딕","Courier New",monospace;
  --navh:62px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#E7EBF3;color:var(--ink);font:16px/1.6 var(--sans)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
#app{max-width:720px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top)}
@media (min-width:760px){#app{box-shadow:0 0 0 1px var(--line)}}

/* ---------- 버튼 · 칩 · 카드 공통 ---------- */
.btn{min-height:50px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:16px;white-space:nowrap;color:var(--ink)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.good{border-color:var(--ok);color:var(--ok)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;font-size:13.5px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.card-h h2{margin:0;font-size:15px;font-weight:700}
.card-h .hl{display:flex;gap:14px}
.card p.note,.note{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:6px 14px;border:1.5px solid var(--line);background:#fff;border-radius:999px;font-size:14.5px;font-weight:500}
.chip small{color:var(--muted);margin-left:6px;font-size:12px;font-weight:400}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.chip[aria-pressed="true"] small{color:#D6E0FF}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap}
.pill.hot{background:var(--primary-soft);color:var(--primary-d);font-weight:700}
.pill.bad{background:var(--bad-soft);color:var(--bad);font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.pill.amber{background:var(--amber-soft);color:#8A6100;font-weight:700}
.ic{display:grid;place-items:center;width:42px;height:42px;border:0;background:none;color:var(--ink);border-radius:12px}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic:active{background:var(--soft)}

/* ---------- 홈 ---------- */
.appbar{display:flex;align-items:center;gap:12px;padding:18px 16px 6px}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#3A66F2,#2449C7);color:#fff;font-weight:800;font-size:19px;box-shadow:0 4px 12px rgba(47,91,234,.35)}
.appbar h1{margin:0;font-size:19px;line-height:1.25;letter-spacing:-0.02em}
.appbar p{margin:0;color:var(--muted);font-size:13px}
.panel{padding:12px 16px 20px;flex:1}
.dash{display:flex;background:linear-gradient(135deg,#2F5BEA,#2347C4);color:#fff;border-radius:var(--r);padding:16px 6px;margin:0 0 14px;box-shadow:0 8px 20px rgba(47,91,234,.28)}
.dash div{flex:1;text-align:center;border-left:1px solid rgba(255,255,255,.22)}
.dash div:first-child{border-left:0}
.dash b{display:block;font-size:21px;line-height:1.3}
.dash span{font-size:12px;opacity:.85}
.seg{display:flex;background:#E4E9F3;border-radius:12px;padding:4px;margin:0 0 14px;gap:2px}
.sg{flex:1;height:38px;border:0;border-radius:9px;background:none;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap}
.sg[aria-selected="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(23,32,51,.12)}
.yr{display:flex;gap:12px;align-items:flex-start;margin:0 0 10px}
.yr:last-child{margin-bottom:0}
.yr .y{flex:none;width:44px;padding-top:9px;font-weight:800;font-size:14px;color:var(--primary-d)}
.rgrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;height:54px;border:1.5px solid var(--line);border-radius:12px;background:#fff;gap:0}
.rbtn b{font-size:15px;line-height:1.2}
.rbtn small{font-size:11.5px;color:var(--muted)}
.rbtn[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.rbtn[aria-pressed="true"] small{color:#D6E0FF}
.startbar{position:sticky;bottom:calc(var(--navh) + env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:rgba(243,245,249,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.startbar .count{font-size:14px;color:var(--muted)}
.startbar .count b{font-size:22px;color:var(--ink);margin-right:2px}
.startbar .btn{min-width:150px}
.bottomnav{position:sticky;bottom:0;z-index:6;display:flex;height:calc(var(--navh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line)}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:500}
.nv svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv[aria-current="page"]{color:var(--primary);font-weight:700}
.nv[aria-current="page"] svg{stroke-width:2.2}
.foot{padding:6px 4px 4px;color:var(--muted);font-size:12px;line-height:1.7}
.foot p{margin:0 0 6px}

/* 목록 */
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.ritem{display:block;width:100%;padding:12px 0;background:none;border:0;text-align:left;font-size:15px}
.ritem .rtop{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ritem .rt{flex:1;min-width:0;font-weight:600}
.ritem .ra{font-size:12.5px;color:var(--muted);font-weight:400;margin-left:4px}
.ritem .snip{margin:5px 0 0;font-size:13.5px;color:var(--muted);line-height:1.55;word-break:break-all;font-weight:400}
.hit{background:#FFE08A;color:var(--ink);border-radius:3px;padding:0 1px}
.sbox{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;margin:0 0 12px;box-shadow:var(--shadow)}
.sbox svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.sbox input{flex:1;min-width:0;border:0;outline:none;background:none;height:48px;font-size:16px}
.sbox:focus-within{border-color:var(--primary)}

/* 통계 */
.srow{padding:12px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.st-top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;margin-bottom:8px}
.st-name{font-weight:700;font-size:15px;white-space:nowrap}
.st-num{font-size:12.5px;color:var(--muted);text-align:right}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:#E8ECF4}
.bar i{display:block;height:100%}
.bar .o{background:var(--ok)}
.bar .x{background:var(--bad)}
.st-btns{display:flex;gap:8px;margin-top:10px}
.weak{font-size:11.5px;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:1px 8px;margin-left:8px;white-space:nowrap}
.grp{margin:0 0 12px}
.grp:last-child{margin-bottom:0}
.grp h3{margin:12px 0 8px;font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.chips.scope{margin:0 0 4px}
.srow.grow{background:var(--soft);border-radius:12px;padding:12px;margin:8px 0 2px;border-top:0}
.srow.sub{padding-left:10px}
.card.fold{padding:0;overflow:hidden}
.fold-h{display:flex;align-items:center;gap:10px;width:100%;padding:16px;border:0;background:none;text-align:left}
.fold-h h2{flex:1;margin:0;font-size:15px;font-weight:700}
.fold-sum{font-size:12.5px;color:var(--muted)}
.chev{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.fold-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fold-b{padding:0 16px 16px;border-top:1px solid var(--line)}
.fold-b>.srow:first-child,.fold-b>.legend+.srow{border-top:0}
.fold-b>.note{margin-top:12px}
.fold-b>.legend{margin-top:12px}
.fold-b>.list{padding-top:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:0 0 4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.hint-box{margin:0 0 12px;padding:14px 16px;background:var(--primary-soft);color:#1E3A9E;border-radius:var(--r);font-size:14.5px;line-height:1.65}

/* ---------- 문제 풀이 ---------- */
.topbar{position:sticky;top:0;z-index:8;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-row{display:flex;align-items:center;padding:4px 6px}
.tb-title{flex:1;text-align:center;min-width:0}
.tb-title b{display:block;font-size:14px;line-height:1.3}
.tb-title span{font-size:12.5px;color:var(--muted)}
.ic.flag[aria-pressed="true"]{color:var(--amber)}
.ic.flag[aria-pressed="true"] svg{fill:var(--amber)}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--primary);border-radius:0 2px 2px 0;transition:width .25s}
.sheet{padding:14px 14px 20px;flex:1}
.qcard{position:relative;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 12px}
.qcard.has-stamp .q-top{padding-right:60px}
.q-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.qn{display:grid;place-items:center;min-width:36px;height:36px;padding:0 8px;border-radius:12px;background:var(--primary);color:#fff;font-weight:800;font-size:17px}
.stamp{position:absolute;top:10px;right:10px;width:54px;height:54px;pointer-events:none}
.stamp svg{width:100%;height:100%;fill:none;stroke-width:4;stroke-linecap:round}
.stamp.o svg{stroke:var(--ok)}
.stamp.x svg{stroke:var(--bad)}
.stamp.anim svg *{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.stamp.anim svg *{animation:none;stroke-dasharray:none;stroke-dashoffset:0}}
.stem{font:600 17px/1.7 var(--sans);white-space:pre-wrap;margin:0 0 12px;word-break:keep-all;overflow-wrap:anywhere}
.extra{font:400 15.5px/1.75 var(--sans);white-space:pre-wrap;margin:0 0 12px;padding:12px 14px;background:var(--soft);border-radius:12px;word-break:keep-all;overflow-wrap:anywhere}
.codebox{margin:0 0 12px;border-radius:12px;overflow:hidden;background:var(--code-bg)}
.codehead{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;background:#16253D;color:#8EA0BE;font-size:12px}
.codehead .lang{font-weight:700;color:#C9D6EC;letter-spacing:.02em}
pre.code{margin:0;color:var(--code-ink);padding:12px 14px;overflow-x:auto;font:13.5px/1.7 var(--mono);tab-size:4;-webkit-overflow-scrolling:touch}
pre.code.ln{padding-left:0}
.cl{display:block;white-space:pre;min-width:max-content;padding-right:14px;cursor:pointer}
.cl.on{background:rgba(255,211,77,.18);box-shadow:inset 3px 0 0 #FFD34D}
.cl .no{display:inline-block;width:2.6em;margin-right:12px;text-align:right;color:#6F82A3;font-style:normal;user-select:none;-webkit-user-select:none}
figure.fig{margin:0 0 12px}
figure.fig img{max-width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;background:#fff}
.fig-missing{border:1.5px dashed var(--bad);color:var(--bad);padding:18px 14px;font-size:14px;margin:0 0 12px;word-break:break-all;border-radius:10px;background:var(--bad-soft)}
.qlink{display:inline-flex;align-items:center;gap:4px;margin-top:2px;font-size:12.5px;color:var(--muted);text-decoration:none}
.qlink:hover{text-decoration:underline}

/* 빈칸 표시 */
.blank{display:inline-block;min-width:2.6em;text-align:center;padding:0 .35em;margin:0 .12em;border-radius:5px;background:#FFE08A;color:#1D2B45;font-weight:700;line-height:1.4;white-space:pre;box-shadow:inset 0 -3px 0 #E0A800}
pre.code .blank{background:#FFD34D;color:#17233A;box-shadow:none;outline:1.5px solid #FFF1B8}
.blank-hint{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;color:var(--muted)}
.blank-hint i{display:inline-block;width:22px;height:14px;border-radius:4px;background:#FFE08A;box-shadow:inset 0 -3px 0 #E0A800}

/* 정답 입력 */
.card.ans-in{padding:16px}
.card.ans-in .ttl{font-size:14px;font-weight:700;margin:0 0 12px}
.in-row{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.in-label{flex:none;min-width:34px;height:34px;padding:0 8px;display:grid;place-items:center;border-radius:10px;background:var(--primary-soft);color:var(--primary-d);font-weight:800;font-size:13.5px}
.in-row input,.in-row textarea{flex:1;min-width:0;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:16px/1.5 var(--sans);background:#fff;color:var(--ink)}
.in-row textarea{resize:vertical;font-family:var(--mono);font-size:15px}
.in-row input:focus,.in-row textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.pickhint{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices.wrap{flex-direction:row;flex-wrap:wrap}
.choice{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:46px;padding:9px 12px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-size:15px;line-height:1.4}
.choices.wrap .choice{width:auto}
.choice .ci{flex:none;display:grid;place-items:center;width:22px;height:22px;border:2px solid #C3CBDA;border-radius:50%;font-style:normal;font-size:11.5px;font-weight:800;color:#fff}
.choice.chk .ci{border-radius:7px}
.choice b{font-weight:800}
.choice .ct{flex:1;min-width:0}
.choice .ct span{color:var(--muted);font-size:14px;margin-left:6px;font-weight:400}
.choice[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.choice[aria-pressed="true"] .ci{background:var(--primary);border-color:var(--primary)}
.choice[aria-pressed="true"] .ct span{color:#4A5E9E}
.eachrow{margin:0 0 14px}
.eachrow:last-of-type{margin-bottom:6px}
.eachrow .in-label{margin:0 0 8px;display:inline-grid}
.skiprow{margin-top:8px;text-align:center}
.msg{margin:10px 0 0;color:var(--bad);font-size:14px}

/* 채점 결과 */
.banner{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;font-weight:800;font-size:16.5px;margin:0 0 14px}
.banner.ok{background:var(--ok-soft);color:#0B7A3B}
.banner.no{background:var(--bad-soft);color:#B3282D}
.banner svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;flex:none}
.mine{margin:0 0 16px;font-size:15px}
.mine h3,.ah{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:700}
.ah{color:var(--primary-d)}
.mine .mrow{display:flex;gap:8px;align-items:baseline;padding:2px 0;word-break:break-all}
.mine .mlab{flex:none;color:var(--muted);min-width:30px}
.mine .no{color:var(--bad);text-decoration:line-through}
.mine .empty{color:var(--muted)}
.ans-line{font:800 17px/1.8 var(--sans);white-space:pre-wrap;overflow-wrap:anywhere}
.ans-note{margin:8px 0 0;color:var(--muted);font-size:13.5px}
.vrow{margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted);line-height:1.6}
.vrow .vi{display:flex;gap:8px;align-items:baseline;margin:4px 0}
.vb{flex:none;display:inline-block;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--ok-soft);color:#0B7A3B}
.vb.src{background:var(--soft);color:var(--muted);font-weight:700}
.vb.warn{background:var(--bad-soft);color:var(--bad)}
.vwarn{margin:8px 0 0;padding:10px 12px;background:var(--amber-soft);border-radius:10px;color:#6B4B00;font-size:13.5px;line-height:1.6}
.explain{margin-top:14px;padding:14px;background:var(--soft);border-radius:12px}
.explain h3{margin:0 0 8px;font-size:13px;color:var(--primary-d)}
.explain .body{white-space:pre-wrap;line-height:1.8;font-size:14.5px;overflow-wrap:anywhere;word-break:keep-all}
.explain code{font:13px var(--mono);background:#fff;border:1px solid var(--line);padding:0 5px;border-radius:5px;word-break:break-all}
.tp{margin-top:14px}
.tp h3{margin:0 0 6px;font-size:12.5px;color:var(--muted)}
.tq{display:flex;flex-wrap:wrap;gap:6px}
.tq button{font-size:13px;padding:4px 11px;border:1.5px solid var(--line);border-radius:999px;background:#fff;min-height:32px}
.tq button[disabled]{background:var(--soft);color:var(--muted);cursor:default}
.learnbox{margin:14px 0 0;padding:14px;border:1.5px solid var(--primary);border-radius:12px;background:var(--primary-soft);font-size:14.5px;line-height:1.65}
.learnbox ul{margin:6px 0 12px;padding-left:18px}
.learnbox .row{display:flex;gap:8px;flex-wrap:wrap}
.grade-label{margin:16px 0 8px;font-size:12.5px;color:var(--muted)}
.grade{display:flex;gap:10px}
.grade button{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-weight:800;font-size:15px}
.grade button svg{width:20px;height:20px;fill:none;stroke-width:2.6;stroke-linecap:round}
.grade .go{color:var(--ok)}.grade .go svg{stroke:var(--ok)}
.grade .gx{color:var(--bad)}.grade .gx svg{stroke:var(--bad)}
.grade .go[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok)}
.grade .gx[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad)}
.memo{margin:0 0 12px}
.memo h3{margin:0 0 8px;font-size:14px}
.memo textarea{display:block;width:100%;height:auto;max-height:min(25vh,200px);padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:15px/1.6 var(--sans);resize:none;overflow-y:auto;background:#fff}
.memo textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.extra.hastbl{white-space:normal}
.extra .tbltxt{white-space:pre-wrap;margin:0 0 8px}

<script>
/* =====================================================================
   데이터
   - 회차를 추가할 때는 ROUNDS.push({...}) 블록을 하나 더 만들면 돼요.
   - area : C / Java / Python / SQL / 데이터베이스 / 소프트웨어 공학 / 테스트 / 네트워크 / 보안 / 운영체제 / 알고리즘 / 기타

interface Number {
    int sum(int[] a, boolean odd);
}

class ODDNumber implements Number {
    public int sum(int[] a, boolean odd) {
        int result = 0;
        for(int i=0; i < a.length; i++){
            if((odd && a[i] % 2 != 0) || (!odd && a[i] % 2 == 0))
                result += a[i];
        }
        return result;
    }

 code:`#include <stdio.h>
#include <stdlib.h>

void set(int** arr, int* data, int rows, int cols) {
    for (int i = 0; i < rows * cols; ++i) {
        arr[((i + 1) / rows) % rows][(i + 1) % cols] = data[i];
    }
}

int main() {
    int rows = 3, cols = 3, sum = 0;
    int data[] = {5, 2, 7, 4, 1, 8, 3, 6, 9};

        sum += arr[i / rows][i % cols] * (i % 2 == 0 ? 1 : -1);

    free(arr);

{n:18, area:"C", type:"code",

 code:`#include <stdio.h>
#include <stdlib.h>

typedef struct Data {
    int value;
    struct Data *next;
} Data;

Data* insert(Data* head, int value) {
    Data* new_node = (Data*)malloc(sizeof(Data));
    new_node->value = value;
    new_node->next = head;

    return new_node;
}

Data* reconnect(Data* head, int value) {
    if (head == NULL || head->value == value) return head;
    Data *prev = NULL, *curr = head;

    while (curr != NULL && curr->value != value) {
        prev = curr;
        curr = curr->next;
    }

    if (curr != NULL && prev != NULL) {
        prev->next = curr->next;
        curr->next = head;
        head = curr;
    }

    return head;
}

int main() {

    Data *head = NULL, *curr;

    for (int i = 1; i <= 5; i++)
        head = insert(head, i);
    head = reconnect(head, 3);

    for (curr = head; curr != NULL; curr = curr->next)
        printf("%d", curr->value);

    return 0;
}`,

 code:`#include <stdio.h>
#define SIZE 3

typedef struct {
    int a[SIZE];
    int front;
    int rear;
} Queue;

void enq(Queue* q, int val){
    q->a[q->rear] = val;
    q->rear = (q->rear + 1) % SIZE;
}

int deq(Queue* q) {
    int val = q->a[q->front];
    q->front = (q->front + 1) % SIZE;

    return val;
}

int main() {
    Queue q = {{0}, 0, 0};

    enq(&q,1); enq(&q,2); deq(&q); enq(&q, 3);

    int first = deq(&q);

    return 0;
}`,

"제3정규형 표": {def: "이행적 함수 종속을 제거한 정규형이에요. 후보키가 아닌 속성이 다른 속성을 결정하면 안 돼요.",
  points: ["1NF 원자값, 2NF 부분 함수 종속 제거, 3NF 이행 함수 종속 제거, BCNF 결정자가 모두 후보키", "결정자(화살표 앞)가 후보키가 아니면 BCNF 위반이에요.", "결정자가 후보키에 포함된 속성에 종속되는 경우는 3NF는 만족할 수 있어요."]},
"OSPF": {def: "링크 상태 방식의 라우팅 프로토콜이에요. 다익스트라 알고리즘으로 최단 경로를 계산해요.",
  points: ["한 자율 시스템 안에서 쓰는 IGP예요.", "RIP(거리 벡터, 홉 수)와 비교해서 큰 네트워크에 알맞아요.", "Open Shortest Path First의 약자예요."]},
"추상 팩토리": {def: "서로 관련된 객체들의 제품군을 구체 클래스를 지정하지 않고 만들게 해 주는 생성 패턴이에요.",
  points: ["'제품군', 'Kit(키트)'가 단서예요.", "Factory Method는 객체 하나, 추상 팩토리는 관련 객체 묶음을 만들어요.", "생성 패턴: Abstract Factory, Builder, Factory Method, Prototype, Singleton"]},
"SRT 평균 대기시간": {def: "남은 실행 시간이 가장 짧은 프로세스를 먼저 실행하는 선점형 스케줄링의 평균 대기시간을 계산하는 문제예요.",
  points: ["새 프로세스가 도착할 때마다 남은 시간을 비교해요.", "대기시간 = 종료시간 - 도착시간 - 실행시간", "평균 대기시간 = 대기시간의 합 / 프로세스 수 (간트 차트를 그려서 계산해요.)"]},
"동치 분할": {def: "입력을 같은 결과가 예상되는 구간으로 나누고, 구간마다 대표값 하나를 테스트하는 블랙박스 기법이에요.",
  points: ["유효 구간과 무효 구간으로 나눠요.", "경계값 분석은 구간의 경계에 있는 값을 테스트해요.", "영어 이름: Equivalence Partitioning"]},
"MAC, RBAC, DAC 접근통제": {def: "접근통제 모델 세 가지예요. MAC은 보안 등급, RBAC은 역할, DAC은 소유자가 권한을 정해요.",
  points: ["MAC(강제적): 중앙의 보안 정책과 등급(레이블)으로 통제해요.", "RBAC(역할 기반): 직무(역할)에 권한 묶음을 줘요.", "DAC(임의적): 자원 소유자가 자유롭게 권한을 줘요."]},
"OAuth": {def: "비밀번호를 주지 않고 액세스 토큰으로 제3의 서비스에 접근 권한을 위임하는 개방형 표준이에요.",
  points: ["소셜 로그인이 대표 예예요.", "핵심은 인가(권한 위임)예요. 인증을 더한 표준은 OIDC예요.", "'토큰'이 단서예요."]},
"조건 커버리지": {def: "결정문 안의 각 조건식이 참과 거짓을 한 번 이상 갖게 하는 커버리지예요.",
  points: ["조건 하나하나를 본다는 점이 단서예요.", "조건은 다 커버해도 결정 전체의 결과(참/거짓)가 다 나오지 않을 수 있어요.", "보완하는 기준: 조건/결정, 다중 조건 커버리지"]},
"LRU 페이지 교체": {def: "가장 오랫동안 쓰이지 않은 페이지를 교체하는 알고리즘이에요.",
  points: ["프레임 수와 참조 순서를 표로 따라가며 페이지 부재 횟수를 세요.", "페이지가 이미 있으면(적중) 그 페이지를 가장 최근 사용으로 갱신해요.", "FIFO는 들어온 순서, LFU는 사용 횟수가 적은 순서로 교체해요."]},
"내용 결합도": {def: "한 모듈이 다른 모듈의 내부 변수나 기능을 직접 참조하는 가장 강한 결합도예요.",
  points: ["결합도 강한 순: 내용 > 공통 > 외부 > 제어 > 스탬프 > 자료", "좋은 설계는 결합도는 낮게, 응집도는 높게 만들어요."]},
"파이썬 문자열 슬라이싱": {def: "문자열[시작:끝:간격]으로 부분 문자열을 뽑는 문법이에요. 끝 인덱스는 포함하지 않아요.",
  points: ["인덱스는 0부터 시작하고, 음수는 뒤에서부터예요. (-1이 마지막)", "{{a[::-1]}}은 문자열 뒤집기예요.", "{{a[:3]}}은 앞 3글자, {{a[-3:]}}은 뒤 3글자예요."]},
"오류 검출(해밍, FEC, BEC, 패리티, CRC)": {def: "해밍은 오류를 정정하고, 패리티는 1비트로 검출하고, CRC는 다항식으로 검출하는 방식이에요.",
  points: ["FEC(전진 오류 수정)는 수신 측이 스스로 정정하고, BEC(후진 오류 수정)는 재전송을 요구해요.", "해밍 코드: 검사 비트를 넣어 1비트 오류를 정정해요.", "CRC: 송수신 양쪽이 같은 다항식으로 나눈 나머지를 비교해요."]},
"HDLC 프레임과 전송 모드": {def: "비트 방식의 데이터 링크 프로토콜이에요. 프레임은 정보(I), 감독(S), 비번호(U) 세 가지예요.",
  points: ["I 프레임: 사용자 데이터 / S 프레임: 흐름·오류 제어 / U 프레임: 링크 설정·해제", "전송 모드: 정규 응답(NRM), 비동기 응답(ARM), 비동기 균형(ABM)", "ABM은 양쪽이 동등한 혼합국이에요."]},
"카디널리티, 차수, 튜플": {def: "릴레이션의 행은 튜플, 행의 수는 카디널리티, 열의 수는 차수(디그리)예요.",
  points: ["속성 = 열, 튜플 = 행, 도메인 = 속성이 가질 수 있는 값의 범위", "릴레이션 스키마는 구조, 릴레이션 인스턴스는 그 시점의 실제 데이터예요.", "외우기: 카디널리티는 행 수, 차수는 열 수"]},

/* ---------- 같은 주제 ---------- */
"디자인 패턴": {def: "자주 쓰이는 설계 문제의 해법에 이름을 붙인 거예요. 생성, 구조, 행위 세 가지로 나눠요.",
  points: ["생성: Abstract Factory, Builder, Factory Method, Prototype, Singleton", "구조: Adapter, Bridge, Composite, Decorator, Facade, Proxy", "행위: Observer, Strategy, Iterator, Command, Visitor, Template Method 등", "문제에 나온 설명의 키워드(대리자, 제품군, 하나만 생성 등)로 이름을 찾아요."]},
"응집도와 결합도": {def: "응집도는 모듈 안 요소들의 관련성(높을수록 좋음), 결합도는 모듈 사이의 의존도(낮을수록 좋음)예요.",
  points: ["응집도 높은 순: 기능 > 순차 > 통신 > 절차 > 시간 > 논리 > 우연", "결합도 강한 순: 내용 > 공통 > 외부 > 제어 > 스탬프 > 자료", "'기순통절시논우'로 응집도를 외워요."]},
"IP 주소와 서브넷 계산": {def: "서브넷 마스크로 네트워크 주소, 브로드캐스트 주소, 호스트 수를 구하는 계산이에요.",
  points: ["호스트 수 = 2^(호스트 비트 수) - 2", "블록 크기 = 256 - 마스크의 마지막 유효 옥텟 (예: 192이면 64)", "IP와 서브넷 마스크를 AND하면 네트워크 주소예요."]},
"테스트 커버리지와 기법": {def: "코드 구조를 기준으로 테스트가 얼마나 지나갔는지 재는 기준과, 블랙박스 테스트 기법을 묶은 주제예요.",
  points: ["커버리지 강도: 구문 < 결정(분기) < 조건 < 조건/결정 < 변경 조건/결정(MC/DC) < 다중 조건", "블랙박스 기법: 동치 분할, 경계값 분석, 원인-결과 그래프", "스텁과 드라이버는 통합 테스트용 임시 모듈이에요."]},
"접근통제, 인증, 암호": {def: "접근통제 모델(MAC, RBAC, DAC), 인증(OAuth, OTP), 암호(대칭키, 비대칭키)를 묶은 주제예요.",
  points: ["대칭키: DES, AES, ARIA, SEED / 비대칭키: RSA, ECC", "OTP: 한 번만 쓰고 버리는 일회용 비밀번호", "템퍼프루핑: 위변조를 막는 소프트웨어 보호 기술"]},
"보안 공격과 악성코드": {def: "네트워크 공격과 악성코드의 이름을 설명으로 찾는 문제예요.",
  points: ["웜(스스로 전파), 바이러스(파일에 기생), 트로이 목마(정상 프로그램으로 위장)", "스머프, SYN Flooding, Ping Flooding은 서비스 거부(DoS) 계열이에요.", "루트킷, APT, 세션 하이재킹, 워터링 홀, 스캐어웨어도 자주 나와요."]},
"오류 검출과 전송 제어": {def: "전송 중 생긴 오류를 찾거나 고치는 방법과 데이터 링크 제어를 묶은 주제예요.",
  points: ["패리티와 CRC는 검출, 해밍은 정정이에요.", "HDLC 프레임: 정보(I), 감독(S), 비번호(U)", "FEC는 스스로 정정, BEC는 재전송을 요구해요."]},
"라우팅과 VPN 프로토콜": {def: "경로를 정하는 프로토콜(RIP, OSPF)과 터널링(L2TP, IPSec, VPN)을 묶은 주제예요.",
  points: ["RIP는 홉 수(최대 15)를 쓰고, OSPF는 링크 상태와 다익스트라를 써요.", "IPSec은 3계층에서 암호화·인증을 해요. (AH, ESP)", "VPN은 공용망 위에 암호화된 터널을 만들어요."]},
"CPU 스케줄링": {def: "프로세스를 어떤 순서로 실행할지 정하는 방법이에요. 평균 대기시간을 표로 계산해요.",
  points: ["FCFS 도착 순, SJF 실행시간이 짧은 순(비선점), SRT 남은 시간이 짧은 순(선점), RR 시간 할당량만큼 돌아가며", "대기시간 = 종료시간 - 도착시간 - 실행시간", "간트 차트를 그려서 계산해요."]},
"페이지 교체": {def: "주기억장치의 프레임이 모자랄 때 어떤 페이지를 내보낼지 정하는 알고리즘이에요.",
  points: ["FIFO 먼저 들어온 것, LRU 가장 오래 안 쓴 것, LFU 가장 적게 쓴 것", "문제는 대개 페이지 부재(fault) 횟수를 세는 거예요.", "적중했을 때 LRU는 사용 순서를 갱신해요."]},
"관계 모델 용어, 키, 무결성": {def: "릴레이션의 구성 용어와 키(기본키, 외래키 등), 무결성 제약 조건을 묶은 주제예요.",
  points: ["튜플 = 행, 속성 = 열, 차수 = 열 수, 카디널리티 = 행 수", "키: 슈퍼키 ⊃ 후보키 ⊃ 기본키, 그리고 대체키, 외래키", "무결성: 개체(기본키는 NULL·중복 불가), 참조(외래키), 도메인"]},
"관계대수와 조인": {def: "릴레이션을 다루는 연산이에요. 일반 집합 연산과 순수 관계 연산(σ, π, ⋈, ÷)이 있어요.",
  points: ["σ는 행을 고르고, π는 열을 골라요.", "조인: 세타 조인, 동등 조인, 자연 조인", "÷(나누기)는 나누는 릴레이션의 모든 값과 결합된 튜플만 남겨요."]},
"정규화": {def: "중복과 이상 현상을 없애려고 릴레이션을 분해하는 과정이에요.",
  points: ["1NF 원자값 → 2NF 부분 함수 종속 제거 → 3NF 이행 종속 제거 → BCNF 결정자가 후보키", "반정규화는 성능을 위해 일부러 중복을 허용하는 거예요.", "이상 현상: 삽입, 삭제, 갱신 이상"]},
"SQL 결과 구하기": {def: "표 데이터와 SQL을 보고 결과(행 수나 값)를 직접 구하는 문제예요.",
  points: ["서브쿼리는 안쪽부터 계산해요.", "AND가 OR보다 먼저 계산되고, NULL과의 비교는 거짓이에요.", "JOIN, GROUP BY, HAVING, UNION의 동작 순서를 기억해요."]},
"SQL 문법 작성과 빈칸": {def: "INSERT, DELETE, CREATE, DROP 같은 문장을 직접 쓰거나 빈칸을 채우는 문제예요.",
  points: ["{{DELETE FROM 테이블 WHERE 조건;}} (WHERE를 빼면 전부 삭제돼요.)", "{{INSERT INTO 테이블(컬럼들) VALUES(값들);}}", "문자열은 작은따옴표로 감싸요."]},
"Java 상속과 오버라이딩": {def: "자식 클래스가 부모의 메서드를 다시 정의하는 거예요. 실제 객체의 메서드가 실행돼요.",
  points: ["메서드는 실제 객체 기준(동적 바인딩), 필드는 참조 변수의 타입 기준이에요.", "오버로딩은 컴파일할 때 정적 타입으로 정해져요.", "생성자는 부모 → 자식 순서로 실행돼요."]},
"Java 예외 처리": {def: "try, catch, finally 구조예요. 예외가 나면 위에서부터 맞는 catch 하나가 실행돼요.",
  points: ["finally는 예외 여부와 상관없이 마지막에 항상 실행돼요.", "ArithmeticException은 정수를 0으로 나눌 때 나와요.", "catch는 위에서부터 처음 맞는 것 하나만 실행돼요."]},
"재귀 함수": {def: "함수가 자기 자신을 호출하는 거예요. 종료 조건과 호출 구조를 따라가요.",
  points: ["호출 트리를 그려서 값을 아래에서부터 합쳐요.", "종료 조건(base case)이 답의 시작점이에요.", "피보나치형은 호출이 두 갈래로 갈라져요."]},

const CIRC = /[①-⑳]/g;

const dropPipe = s => String(s).replace(/\|\|/g, "\u0001").replace(/\|/g, "").replace(/\u0001/g, "||");
function normStr(s, q, f){
  s = String(s == null ? "" : s).replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/\u00A0/g," ");
  if(f && f.digits){

  if(q.type === "code" || q.type === "calc") return dropPipe(s).replace(/\s+/g,"").replace(/ms$/i,"");
  if(q.type === "fill") return s.replace(/\s+/g,"").toLowerCase().replace(/;+$/,"");
  return s.toLowerCase().replace(/[\s.,;:'"()\[\]{}<>·\-_]/g,"");
}
function ipToInt(ip){
  const p = String(ip).trim().split(".");
  if(p.length !== 4) return null;
  let n = 0;
  for(const x of p){ if(!/^\d{1,3}$/.test(x) || +x > 255) return null; n = n*256 + (+x); }
  return n;
}
function inCidr(ip, cidr){
  const parts = cidr.split("/"), len = +parts[1];
  const base = ipToInt(parts[0]), v = ipToInt(ip);
  if(base == null || v == null) return false;
  const size = Math.pow(2, 32 - len), net = Math.floor(base/size)*size;
  return v > net && v < net + size - 1;
}
const LABEL_RE = /^(\(\s*\d+\s*\)|\d+\)|\d+\.|[①-⑳]|[ㄱ-ㅎ]\.|[a-z]\.)\s+/i;
function parseLine(s){
  const m = LABEL_RE.exec(s);
  return m ? {label:m[1].replace(/\s/g,""), value:s.slice(m[0].length)} : {label:"", value:s};
}
function variants(val){
  const out = new Set();
  const add = s => { s = String(s).trim(); if(s) out.add(s); };
  add(val);
  String(val).split(/\s+또는\s+|\s+or\s+/i).forEach(part => {
    add(part);
    const m = /^(.*?)\s*\((.*)\)\s*$/.exec(part.trim());
    if(m){
      add(m[1]);
      const inner = m[2].trim().replace(/^또는\s*/,"");
      if(!/^대소문자/.test(inner)){ add(inner); inner.split(/\s*[,\/]\s*/).forEach(add); }

}
function parseBogi(q){

  const at = t.lastIndexOf("[보기]");

  const re = /([㉠-㉧]|[ㄱ-ㅎ]\.)\s*/g, marks = [], map = {};

  marks.forEach((mk,i) => {
    const next = i + 1 < marks.length ? marks[i+1].start : seg.length;
    const txt = seg.slice(mk.end, next).split("\n")[0].trim();
    if(!(mk.ch in map)) map[mk.ch] = txt;
  });

}

const FORMS = {};

    f = {mode:sp.mode, opts:optList(q, sp.opts), key:sp.key.slice(), hint:sp.hint};
  } else if(sp.mode === "each"){
    f = {mode:"each", multi:!!sp.multi, labels:sp.labels, opts:optList(q, sp.opts), key:sp.key};
  } else {
    f = {mode:"text", combos:sp.combos, setTokens:sp.setTokens};

function linesEqual(u, e){
  const ul = linesOf(u), el = linesOf(e), sq = x => dropPipe(x).replace(/\s+/g, "");
  if(!el.length || !ul.length) return false;
  if(ul.length === el.length) return el.every((l, i) => sq(l) === sq(ul[i]));
  if(ul.length === 1 && el.length > 1 && el.every(l => !/\s/.test(l))){

function gradeQ(q, f, inp){
  if(f.mode === "pick"){
    const sel = (inp.sel || []).slice();
    if(!sel.length) return {empty:true};
    return {ok: sel.length === f.key.length && f.key.every(k => sel.indexOf(k) >= 0)};
  }
  if(f.mode === "order"){
    const sel = inp.sel || [];
    if(!sel.length) return {empty:true};
    return {ok: sel.length === f.key.length && f.key.every((k,i) => sel[i] === k)};
  }
  if(f.mode === "each"){
    const ea = inp.each || [];
    if(!f.key.some((k,i) => ea[i] && (f.multi ? ea[i].length : true))) return {empty:true};
    const per = f.key.map((k,i) => {

    const a = tokensOf(t[0]), b = f.setTokens.slice().sort();

    if(!val.trim()) return false;

function areaScope(selected, pool){
  const eq = (a, b) => a.length === b.length && a.every(x => b.indexOf(x) >= 0);
  const cur = pool.filter(a => selected.has(a));
  if(eq(cur, pool)) return "all";
  for(const g of AREA_GROUPS){ const ga = g.areas.filter(a => pool.indexOf(a) >= 0); if(ga.length && eq(cur, ga)) return g.id; }
  return "";
}
function scopeAreas(scope, pool){
  if(scope === "all") return pool.slice();
  const g = AREA_GROUPS.find(x => x.id === scope);
  return g ? g.areas.filter(a => pool.indexOf(a) >= 0) : [];
}
function scopeRow(act, selected, pool, countFn){
  const cur = areaScope(selected, pool);
  let h = chip(act, 'data-v="all"', "전체", cur === "all", pool.reduce((n, a) => n + countFn(a), 0));
  AREA_GROUPS.forEach(g => { const ga = g.areas.filter(a => pool.indexOf(a) >= 0); if(ga.length) h += chip(act, 'data-v="'+g.id+'"', g.name+"만", cur === g.id, ga.reduce((n, a) => n + countFn(a), 0)); });
  return '<div class="chips scope">' + h + '</div>';
}
function groupedChips(act, selected, pool, countFn){

}

      + bar(r.s) + btns("area", r.a, r.s) + '</div>').join("")).join(""));
  h += foldSec("type", "유형별", typesPresent.length+"개 유형", typesPresent.map(t => { const s = stat(ALL.filter(q => q.type === t[0]));

  const same = TOPICS.map((t,i) => ({t:t, i:i})).filter(x => x.t.k === "same").sort((a,b) => b.t.ids.length - a.t.ids.length || a.t.n.localeCompare(b.t.n));
  h += foldSec("topic", "자주 나오는 개념", same.length+"개", '<p class="note">여러 회차에서 같은 개념이 다시 나온 문제들이에요. 반복 출제된 순서대로 보여줘요.</p>' + same.map(x => {

    : '<p class="note" style="margin:0">아직 틀린 기록이 없어요.</p>');

/* 문제의 보기(extra/after)에 글자로 적힌 표를 표 모양으로 바꿔요
   - "T1(A) : 3, 1, 4"       -> 이름 T1, 칸 3 / 1 / 4 (값이 한 칸씩)
   - "사원 [사원번호(PK), 이름]" -> 이름 사원, 머리글 칸들
   - "학번 | 이름 | 학년"      -> 줄마다 한 행인 표 (첫 줄은 머리글)
   표로 바꿀 줄이 없으면 null을 돌려줘서 기존처럼 글로 보여줘요. */
const TBL_COLS = /^([A-Za-z_가-힣][\w가-힣]*)\s*\(([^()]+)\)\s*:\s*(.+,.+)$/;
const TBL_HEAD = /^([A-Za-z_가-힣][\w가-힣]*)\s*\[(.+,.+)\]\s*$/;
function tableRows(text){
  const lines = String(text).split("\n");
  const parts = []; let hit = false;
  for(let i = 0; i < lines.length; i++){
    const ln = lines[i];
    let m;
    if((m = ln.trim().match(TBL_COLS))){
      hit = true;
      parts.push({k:"col", name:m[1], vals:m[3].split(",").map(x => x.trim()).filter(x => x !== "")});
    } else if((m = ln.trim().match(TBL_HEAD))){
      hit = true;
      parts.push({k:"head", name:m[1], cols:m[2].split(",").map(x => x.trim()).filter(x => x !== "")});
    } else if(ln.indexOf(" | ") >= 0){
      const rows = [];
      while(i < lines.length && lines[i].indexOf(" | ") >= 0){ rows.push(lines[i].split("|").map(x => x.trim())); i++; }
      i--; hit = true; parts.push({k:"grid", rows:rows});
    } else parts.push({k:"text", t:ln});
  }
  return hit ? parts : null;
}
function tableBlockHTML(text, q, bl){
  const parts = tableRows(text);
  if(!parts) return null;
  let h = "", buf = [], tbls = "";
  const flushText = () => { if(buf.length){ const t = buf.join("\n").replace(/^\n+|\n+$/g, ""); if(t) h += '<div class="tbltxt">' + hl(esc(t), q, bl) + '</div>'; buf = []; } };
  const flushTbl = () => { if(tbls){ h += '<div class="tblfig">' + tbls + '</div>'; tbls = ""; } };
  parts.forEach(pt => {
    if(pt.k === "text"){ flushTbl(); buf.push(pt.t); return; }
    flushText();
    if(pt.k === "col") tbls += '<figure><figcaption>' + esc(pt.name) + '</figcaption><table class="qtbl">' + pt.vals.map(v => '<tr><td>' + esc(v) + '</td></tr>').join("") + '</table></figure>';
    else if(pt.k === "head") tbls += '<figure><figcaption>' + esc(pt.name) + '</figcaption><table class="qtbl"><tr>' + pt.cols.map(c => '<th>' + esc(c) + '</th>').join("") + '</tr></table></figure>';
    else { flushTbl(); h += '<div class="tblscroll"><table class="qtbl">' + pt.rows.map((r, i) => '<tr>' + r.map(c => i === 0 ? '<th>' + esc(c) + '</th>' : '<td>' + esc(c) + '</td>').join("") + '</tr>').join("") + '</table></div>'; }
  });
  flushText(); flushTbl();
  return h;
}
function questionBody(q, bl, withBlankHints){
  const stemH = '<p class="stem">'+hl(esc(q.stem), q, bl)+'</p>';
  const extraT = q.extra ? tableBlockHTML(q.extra, q, bl) : null;
  const extraH = q.extra ? '<div class="extra' + (extraT ? ' hastbl' : '') + '">' + (extraT !== null ? extraT : hl(esc(q.extra), q, bl)) + '</div>' : '';
  const codeH = q.code ? codeBlock(q, bl) : '';
  const afterT = q.after ? tableBlockHTML(q.after, q, bl) : null;
  const afterH = q.after ? '<div class="extra' + (afterT ? ' hastbl' : '') + '">' + (afterT !== null ? afterT : hl(esc(q.after), q, bl)) + '</div>' : '';
  const figH = figs(imgNames(q,"q"));
  let h = stemH;
  if(withBlankHints){
    if(bl.n) h += '<p class="blank-hint"><i></i><span>노란색으로 표시된 곳이 채워 넣을 빈칸이에요</span></p>';

  }
  return h + extraH + (q.imgAfterCode ? codeH + figH : figH + codeH) + afterH;
}

      + (info.special ? '<p class="d" style="color:var(--bad)">이 문제는 채점 규칙이 따로 있어서 정답 표시만 바뀌어요. 채점 결과는 아래 맞았어요 / 틀렸어요 버튼으로 고쳐 주세요.</p>' : '');
  } else {

function verifyHTML(q){

/* 정답 바로 아래에 크게 보이는 개념 노트 버튼 (같은 개념 → 같은 주제 순) */
function conceptBarHTML(q){
  if(q.ai) return "";
  const tps = topicsOf(q.id).sort((a,b) => (a.t.k === b.t.k ? b.t.ids.length - a.t.ids.length : (a.t.k === "same" ? -1 : 1)));
  if(!tps.length) return "";
  return '<div class="conceptbar">' + tps.map(x => '<button class="cbtn" data-act="openNote" data-t="'+x.i+'"><span class="cbk">개념 노트</span><span class="cbn">'+esc(x.t.n)+'</span><span class="cbg" aria-hidden="true">보기 ›</span></button>').join("") + '</div>';
}
function topicsHTML(q){
  const tps = topicsOf(q.id).sort((a,b) => (a.t.k === b.t.k ? b.t.ids.length - a.t.ids.length : (a.t.k === "same" ? -1 : 1)));
  if(!tps.length) return "";
  return tps.map(x => {
    const t = x.t, many = t.ids.length > 8;
    return '<div class="tp"><h3>'+(t.k === "same" ? '같은 개념이 '+t.ids.length+'회 출제: ' : '같은 주제 '+t.ids.length+'문제: ')+esc(t.n)+'</h3><div class="tq">'
      + (many
          ? '<button data-act="topicPeek" data-t="'+x.i+'">이 주제 문제 보기</button>'
          : t.ids.map(id => '<button data-act="openTopicQ" data-t="'+x.i+'" data-id="'+id+'" '+(id === q.id ? 'disabled' : '')+'>'+esc(BY_ID[id].label)+'</button>').join(""))
      + '</div></div>';
  }).join("");
}
function topbarHTML(title, pos, progressPct, q){
  return '<div class="topbar"><div class="tb-row"><button class="ic" data-act="home" aria-label="'+(state.screen === "solve" && state.session && state.session.peek ? "돌아가기" : "나가기")+'">'+ICON.back+'</button>'

    + (state.screen === "solve" ? '<button class="ic" data-act="navOpen" aria-label="문제 목록">'+ICON.grid+'</button>' : '')

}
function navSheetHTML(){

    + '<h2>문제 목록</h2><div class="legend" style="margin-top:6px"><span><i style="background:var(--ok)"></i>맞음</span><span><i style="background:var(--bad)"></i>틀림</span><span><i style="background:var(--amber)"></i>체크</span></div>'
    + '<div class="tiles">' + s.list.map((q,i) => '<button class="tile '+(s.res[q.id] || "")+(i === s.i ? " cur" : "")+(flags[q.id] ? " fl" : "")+'" data-act="jump" data-i="'+i+'" aria-label="'+(i+1)+'번">'+(i+1)+'</button>').join("") + '</div></div>';

function calcFit(el){
  if(!el) return;

  el.style.height = Math.min(el.scrollHeight + 2, Math.round(Math.min(window.innerHeight * 0.25, 200))) + "px";
}
function calcDockHTML(q, s){

  return '<div class="calcdock"><button class="calc-h" data-act="calcToggle" aria-expanded="' + (open ? "true" : "false") + '"><span>계산 노트</span><span class="cs">' + (n ? n + '줄 적음' : '비어 있음') + '</span>'
    + '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>'
    + (open ? '<div class="calc-b"><textarea data-calc rows="1" placeholder="계산 과정을 줄 맞춰 적어요" spellcheck="false" autocapitalize="off" autocomplete="off">' + esc(v) + '</textarea><p class="d">이 문제에만 저장돼요. 메모와는 따로예요.</p></div>' : '') + '</div>';

/* 복습 완료: 오답노트에서 바로 빼요 (연속 2번 맞히기를 기다리지 않아도 돼요) */
function wbDoneHTML(q){
  if(q.ai) return "";
  const s = state.session;
  if(wrongBook[q.id]) return '<button class="btn sm wbdone" data-act="wbDone">복습 완료 (오답노트에서 빼기)</button>';
  if(s.wbRemoved && s.wbRemoved[q.id]) return '<div class="wbnote ok"><b>복습 완료!</b> 오답노트에서 뺐어요. <button class="link" data-act="wbUndo">되돌리기</button></div>';

}
function renderSolve(){
  const s = state.session, q = s.list[s.i], total = s.list.length;
  if(s.calcQ !== q.id){ s.calcOpen = false; s.calcQ = q.id; }
  const st = s.st[q.id], res = s.res[q.id], f = formOf(q), inp = getInp(q.id);
  const last = s.i === total - 1;
  const anim = s.justGraded === q.id;
  s.justGraded = null;

  let h = topbarHTML(q.ai ? "AI 예상문제" : q.year+"년 "+q.round+"회", (s.i+1)+" / "+total, (s.i+1)/total*100, q);
  h += '<main class="sheet">' + (s.peek ? '<div class="peekbar"><div><b>관련 문제를 보고 있어요</b><span>' + esc(s.peekFrom || "이전 화면") + '에서 이동했어요</span></div><button class="btn sm primary" data-act="peekBack">돌아가기</button></div>' : '')
    + '<article class="qcard'+(res ? " has-stamp" : "")+'">'
    + (res ? '<span class="stamp '+res+(anim ? " anim" : "")+'">'+(res === "o" ? STAMP_O : STAMP_X)+'</span>' : '')
    + '<div class="q-top"><span class="qn">'+q.n+'</span><span class="pill">'+esc(q.area)+'</span><span class="pill">'+esc(TYPE_NAME[q.type]||q.type)+'</span>' + (q.ai ? '<span class="pill hot">AI 생성</span>' : '') + freqTag(q)
    + (!res && wrongBook[q.id] ? '<span class="pill bad">오답노트 ' + wrongBook[q.id].s + '/' + GRAD_STREAK + '</span>' : '') + '</div>'
    + (!st ? wbDoneHTML(q) : "")
    + questionBody(q, {n:0}, true)
    + '<div class="qfoot">'+(q.ai ? '<span></span>' : '<a class="qlink" href="'+esc(q.src)+'" target="_blank" rel="noopener noreferrer">원문 보기 '+ICON.ext+'</a>')+'<button class="aibtn" data-act="chatOpen">'+ICON.spark+'AI에게 물어보기</button></div></article>';

  if(!st){
    h += renderInputs(q, f, inp, s.msg[q.id]);
  } else {
    const r = s.last[q.id];
    h += '<section class="card">';
    if(st === "graded"){
      let cls, txt;
      if(res === "o" && r.ok) { cls = "ok"; txt = r.learned ? "정답이에요. 인정한 답으로 저장했어요" : "정답이에요"; }
      else if(res === "o") { cls = "ok"; txt = "자동 채점은 틀림이었지만 맞음으로 고쳤어요"; }
      else if(r.ok) { cls = "no"; txt = "자동 채점은 정답이었지만 틀림으로 고쳤어요"; }
      else { cls = "no"; txt = "틀렸어요"; }
      h += '<div class="banner '+cls+'">'+(cls === "ok" ? ICON.o : ICON.x)+'<span>'+txt+'</span></div>' + mineHTML(q, f, inp, r);
    }
    h += wrongBookHTML(q, res) + '<h3 class="ah">정답'+(ansfix[q.id] ? ' <span class="pill amber">내가 고친 정답</span>' : '')+'</h3>' + q.ans.map(a => '<div class="ans-line">'+esc(a)+'</div>').join("");
    if(q.note) h += '<p class="ans-note">'+esc(q.note)+'</p>';
    h += figs(imgNames(q,"a")) + conceptBarHTML(q) + verifyHTML(q) + fixHTML(q, f);
    if(explOf(q)) h += '<div class="explain"><h3>해설</h3><div class="body">'+fmtExpl(explOf(q))+'</div></div>';
    h += traceHTML(q);
    h += topicsHTML(q);
    if(s.learnAsk[q.id]){
      const bad = f.fields.map((fd,i) => i).filter(i => r.per && r.per[i] === false);
      h += '<div class="learnbox"><b>내가 쓴 답을 앞으로 정답으로 인정할까요?</b><ul>'
        + bad.map(i => '<li>'+(f.fields[i].label ? esc(f.fields[i].label)+' ' : '')+'<b>'+esc(String(inp.t[i] || "").trim())+'</b></li>').join("")
        + '</ul><div class="row"><button class="btn sm primary" data-act="learnYes">인정하고 맞음으로</button><button class="btn sm" data-act="learnNo">이번만 맞음으로</button><button class="btn sm" data-act="learnCancel">취소</button></div></div>';
    } else {
      h += '<p class="grade-label">'+(st === "graded" ? "자동 채점이 다르면 직접 바꿀 수 있어요" : "정답을 보고 스스로 채점해요")+'</p>'
        + '<div class="grade"><button class="go" data-act="grade" data-v="o" aria-pressed="'+(res==="o")+'">'+ICON.o+'맞았어요</button>'
        + '<button class="gx" data-act="grade" data-v="x" aria-pressed="'+(res==="x")+'">'+ICON.x+'틀렸어요</button></div>';
    }
    h += '<div class="skiprow"><button class="link" data-act="retry">이 문제 다시 풀기</button></div></section>';
  }

  const note = notes[q.id] || "";
  h += '<section class="card memo"><h3>내 메모</h3>'
    + ((note || s.memoOpen[q.id])
        ? '<textarea data-memo rows="1" placeholder="헷갈린 점, 외울 키워드 등을 적어요" spellcheck="false">'+esc(note)+'</textarea>'
        : '<button class="btn sm" data-act="memoOpen">메모 쓰기</button>')
    + '</section></main>';

  const single = s.peek && total === 1;
  h += '<div class="dockwrap">' + calcDockHTML(q, s) + '<div class="actionbar">';
  if(single && st) h += '<button class="btn primary" data-act="peekBack">돌아가기</button>';
  else {
    h += single ? '<button class="btn" data-act="peekBack">돌아가기</button>' : '<button class="btn" data-act="prev" '+(s.i===0?"disabled":"")+'>이전</button>';
    h += st ? '<button class="btn primary" data-act="next">'+(last ? (s.peek ? "돌아가기" : "결과 보기") : "다음 문제")+'</button>'
            : '<button class="btn" data-act="reveal">정답 보기</button><button class="btn primary" data-act="check">채점하기</button>';
  }
  h += '</div></div>';
  if(state.navOpen) h += navSheetHTML();

  $app.innerHTML = h;
  if(s.focusCalc){
    const el = $app.querySelector("[data-calc]");
    if(el){ try{ el.focus({preventScroll:true}); el.setSelectionRange(el.value.length, el.value.length); }catch(e){} }
  } else if(s.focusMemo){
    const el = $app.querySelector("[data-memo]");
    if(el){ try{ el.focus({preventScroll:true}); }catch(e){} }
  } else if(!st && f.mode === "text" && s.focusNext && !state.navOpen){
    const el = $app.querySelector("[data-inp]");
    if(el && window.matchMedia && window.matchMedia("(hover:hover)").matches){ try{ el.focus({preventScroll:true}); }catch(e){} }
  }
  calcFit($app.querySelector("[data-calc]")); calcFit($app.querySelector("[data-memo]"));
  s.focusNext = false; s.focusMemo = false; s.focusCalc = false;
}

    + '<circle class="fg" cx="75" cy="75" r="62" fill="none" stroke-width="14" stroke-linecap="'+(p < 7 ? "butt" : "round")+'" stroke="'+color+'" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-p/100)).toFixed(1)+'"/></svg>'
    + '<div class="mid"><div><b>'+p+'%</b><span>정답률</span></div></div></div>';
}
function renderResult(){

const MODE_LABEL = {rounds:"회차별", areas:"영역별", topics:"주제별", random:"무작위", review:"복습", ai:"AI 예상문제"};

  const s = state.session;

    const a = att[q.id] || (att[q.id] = [0,0]);
    if(prev === undefined){ a[0]++; if(v === "o") a[1]++; }
    else if(prev !== v){ a[1] += v === "o" ? 1 : -1; }
    progress[q.id] = v;
    save("progress", progress); save("att", att);
    if(!(q.id in s.wbBefore)) s.wbBefore[q.id] = wrongBook[q.id] ? {s: wrongBook[q.id].s} : null;

    else if(before){ const n = before.s + 1; nb = n >= GRAD_STREAK ? null : {s: n}; }

  const from = state.screen === "solve" && state.session ? curQ().label : (state.screen === "card" && state.cs ? state.cs.list[state.cs.i].label : (state.screen === "note" ? "개념 노트 (" + TOPICS[state.noteTopic].n + ")" : ""));
  state.peekStack.push({screen: state.screen, session: state.session, cs: state.cs, y: window.scrollY, from: from});
  state.chatOpen = false; state.navOpen = false;
  newSession(list, i, label, true);
  state.session.peekFrom = from;

function peekBack(){
  const ctx = state.peekStack.pop();
  if(!ctx) return false;
  state.screen = ctx.screen; state.session = ctx.session; state.cs = ctx.cs; state.navOpen = false; state.chatOpen = false;
  render();
  try{ window.scrollTo(0, ctx.y || 0); }catch(e){}
  return true;
}

}

/* =====================================================================
   AI 도우미 (Gemini)
   - 각자 자기 Gemini API 키를 설정에 넣어서 써요. 키는 이 기기의 브라우저에만 저장돼요.
   - 키는 기록 백업 파일에 들어가지 않아요.
   ===================================================================== */
const GAPI = "https://generativelanguage.googleapis.com/v1beta";
const AI_KEY_URL = "https://aistudio.google.com/app/apikey";
const AI_DEFAULT_MODEL = "gemini-3.5-flash-lite";
const IMGCACHE = {};
const aiReady = () => !!(ai.key && ai.key.trim());

const RETRY_SCALE = () => (typeof window.__jcsRetryScale === "number" ? window.__jcsRetryScale : 1);
const FALLBACK_MODEL = "gemini-3.5-flash-lite";
function abortErr(){ const e = new Error("aborted"); e.aborted = true; return e; }
function sleepAbortable(ms, signal){
  return new Promise((res, rej) => {
    if(signal && signal.aborted){ rej(abortErr()); return; }
    const t = setTimeout(res, ms * RETRY_SCALE());
    if(signal) signal.addEventListener("abort", () => { clearTimeout(t); rej(abortErr()); }, {once: true});
  });
}
function parseRetryAfter(res, data){
  let sec = 0;
  try{ const h = res.headers && res.headers.get && res.headers.get("retry-after"); if(h && isFinite(parseFloat(h))) sec = parseFloat(h); }catch(e){}
  const det = data && data.error && data.error.details;
  if(Array.isArray(det)) det.forEach(x => { if(x && typeof x.retryDelay === "string"){ const m = /([\d.]+)\s*s/.exec(x.retryDelay); if(m) sec = Math.max(sec, parseFloat(m[1])); } });
  const msg = data && data.error && data.error.message;
  if(!sec && typeof msg === "string"){ const m = /retry in ([\d.]+)\s*s/i.exec(msg); if(m) sec = parseFloat(m[1]); }
  return sec;
}
async function httpError(res){
  let data = null;
  try{ data = await res.json(); }catch(e){}
  const err = new Error((data && data.error && data.error.message) || ("HTTP " + res.status));
  err.status = res.status; err.retryAfter = parseRetryAfter(res, data);
  return err;
}
async function gem(path, body, method, signal){
  let res;
  try{
    res = await fetch(GAPI + path, {
      method: method || "POST",
      headers: {"Content-Type":"application/json", "x-goog-api-key": ai.key.trim()},
      body: body ? JSON.stringify(body) : undefined,
      signal: signal
    });
  }catch(e){ if(e && e.name === "AbortError") throw abortErr(); throw e; }
  if(!res.ok) throw await httpError(res);
  let data = null;
  try{ data = await res.json(); }catch(e){}
  return data;
}
/* 답변을 조금씩 받아요 (SSE). 이미 일부를 받은 뒤 끊기면 err.partial 로 표시해요. */
const STREAM_WAIT_MS = 20000;
/* 20초 안에 첫 글자가 안 오면 서버가 바쁜 것으로 보고(503) 다시 시도하거나 다른 모델로 넘어가요 */
async function gemStream(model, body, signal, onDelta){
  const tc = new AbortController();
  let timedOut = false, timer = 0;
  const userAbort = () => tc.abort();
  if(signal){ if(signal.aborted) tc.abort(); else signal.addEventListener("abort", userAbort, {once: true}); }
  timer = setTimeout(() => { timedOut = true; tc.abort(); }, STREAM_WAIT_MS * RETRY_SCALE());
  const first = t => { if(timer){ clearTimeout(timer); timer = 0; } onDelta(t); };
  try{ return await gemStreamRaw(model, body, tc.signal, first); }
  catch(e){
    if(e && e.aborted && timedOut && !(signal && signal.aborted)){ const er = new Error("timeout"); er.status = 503; er.timeout = true; throw er; }
    throw e;
  }
  finally{ if(timer) clearTimeout(timer); if(signal) signal.removeEventListener("abort", userAbort); }
}
async function gemStreamRaw(model, body, signal, onDelta){
  let res;
  try{
    res = await fetch(GAPI + "/models/" + encodeURIComponent(model) + ":streamGenerateContent?alt=sse", {
      method: "POST",
      headers: {"Content-Type":"application/json", "x-goog-api-key": ai.key.trim()},
      body: JSON.stringify(body), signal: signal
    });
  }catch(e){ if(e && e.name === "AbortError") throw abortErr(); throw e; }
  if(!res.ok) throw await httpError(res);
  let text = "", finish = "", blocked = false, buf = "";
  const handle = o => {
    if(o && o.promptFeedback && o.promptFeedback.blockReason) blocked = true;
    const c = ((o && o.candidates) || [])[0];
    if(!c) return;
    const t = ((c.content && c.content.parts) || []).map(p => p.text || "").join("");
    if(t){ text += t; onDelta(text); }
    if(c.finishReason) finish = c.finishReason;
  };
  const feed = (chunk, last) => {
    buf += chunk;
    const evs = buf.split(/\r?\n\r?\n/);
    buf = last ? "" : evs.pop();
    (last ? evs.concat(buf ? [buf] : []) : evs).forEach(ev => {
      const data = ev.split(/\r?\n/).filter(l => l.indexOf("data:") === 0).map(l => l.slice(5).replace(/^ /, "")).join("\n").trim();
      if(!data || data === "[DONE]") return;
      try{ handle(JSON.parse(data)); }catch(e){}
    });
  };
  try{
    if(res.body && res.body.getReader){
      const rd = res.body.getReader(), dec = new TextDecoder();
      for(;;){ const r = await rd.read(); if(r.done) break; feed(dec.decode(r.value, {stream: true}), false); }
      feed(dec.decode(), true);
    } else feed(await res.text(), true);
  }catch(e){
    if(e && (e.name === "AbortError" || e.aborted)) throw abortErr();
    const er = new Error((e && e.message) || "stream"); er.partial = !!text; er.status = 0; throw er;
  }
  if(!text.trim()){ const er = new Error("blocked"); er.blocked = true; throw er; }
  return {text: finish === "MAX_TOKENS" ? text + "\n\n(답변이 길어서 중간에 끊겼어요. '이어서 설명해줘'라고 물어보세요.)" : text, finish: finish};
}
const ALT_MODEL = "gemini-3.6-flash";
/* 서버가 바쁘면 다른 모델로 바꿔 봐요: Flash-Lite가 안 되면 3.6 Flash로, 그 밖의 모델은 Flash-Lite로 */
function modelChain(primary){
  const p = primary || AI_DEFAULT_MODEL;
  if(ai.fallback === false) return [p];
  const other = /lite/.test(p) ? ALT_MODEL : FALLBACK_MODEL;

async function withRetry(call, o){

      catch(e){

async function getImages(q){
  const names = imgNames(q, "q"), out = [];

    let got = null;
    for(const ext of EXTS){
      try{
        const r = await fetch("img/" + n + "." + ext);
        if(!r.ok) continue;
        const blob = await r.blob();
        const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
        got = {mime: blob.type || "image/png", b64: b64}; break;
      }catch(e){}
    }
    if(!got) return [];
    IMGCACHE[n] = got; out.push(got);
  }
  return out;
}

/* AI가 가끔 LaTeX 수식($5 \\times 2^3$)을 써서 화면에 기호가 깨져 보여요. 일반 글자(5 × 2³)로 바꿔요. 코드는 건드리지 않아요. */
const SUP = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","+":"⁺","-":"⁻","=":"⁼","(":"⁽",")":"⁾","n":"ⁿ","i":"ⁱ"};

function texSyms(x){

         .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, "($1)/($2)")
         .replace(/\\sqrt\{([^{}]*)\}/g, "√($1)");
  }
  x = texSyms(x).replace(/\\(?:left|right)\b/g, "").replace(/\\[,;:! ]|\\quad|\\qquad/g, " ");
  x = x.replace(/\^\{([^{}]*)\}|\^([A-Za-z0-9])/g, (m, a, b) => { const t = a != null ? a : b; return Array.from(t).every(c => SUP[c]) ? Array.from(t).map(c => SUP[c]).join("") : "^" + (t.length > 1 ? "(" + t + ")" : t); });

function bindChat(root){
  root.addEventListener("click", e => {
    const el = e.target.closest("[data-chat]");
    if(!el || el.disabled) return;
    const d = el.dataset, q = chatQ();
    switch(d.chat){
      case "close": state.chatOpen = false; renderChat(true); break;
      case "send": { const ta = document.getElementById("cdraft"); chatSend(ta ? ta.value : state.chatDraft); break; }
      case "quick": chatSend(state.chatQuick[+d.i]); break;
      case "retry": if(q && !state.chatBusy) runChat(q); break;
      case "stop": chatStop(); break;
      case "regen": {
        if(!q || state.chatBusy) break;
        const h = chats[q.id] || [];
        if(h.length && h[h.length - 1].r === "m"){ h.pop(); save("chats", chats); runChat(q); }
        break;
      }
      case "edit": {
        if(!q || state.chatBusy) break;
        const h = chats[q.id] || [], i = +d.i, m = h[i];
        if(!m || m.r !== "u") break;
        if(state.chatEdit) chatRestoreEdit();
        const hh = chats[q.id];
        state.chatEdit = {qid: q.id, backup: hh.slice(i)};
        chats[q.id] = hh.slice(0, i); state.chatDraft = m.t; state.chatErr = ""; save("chats", chats);
        renderChat(true);
        const ta = document.getElementById("cdraft"); if(ta){ ta.value = m.t; try{ ta.focus({preventScroll:true}); }catch(err){} }
        break;
      }
      case "editcancel": chatRestoreEdit(); state.chatErr = ""; renderChat(true); break;
      case "clear": if(q && !state.chatBusy && confirm("이 문제의 AI 대화를 모두 지울까요?")){ delete chats[q.id]; state.chatEdit = null; save("chats", chats); state.chatErr = ""; renderChat(true); } break;
      case "tonote": {
        const m = q && (chats[q.id] || [])[+d.i]; if(!m) break;
        const add = "[AI 답변] " + m.t.replace(/\s+\n/g, "\n").slice(0, 1200);
        notes[q.id] = notes[q.id] ? notes[q.id] + "\n\n" + add : add;
        save("notes", notes); delete HAY[q.id];
        el.textContent = "메모에 추가했어요"; el.disabled = true; render(); break;
      }
      case "copy": { const m = q && (chats[q.id] || [])[+d.i]; if(m){ copyText(m.t, null); el.textContent = "복사했어요"; } break; }
      case "setup": state.chatOpen = false; state.screen = "data"; state.dataMsg = null; render(); try{ window.scrollTo(0,0); }catch(err){} break;
      case "web": if(q){ const ok = copyText(fallbackPrompt(q), null); try{ window.open("https://gemini.google.com/app", "_blank", "noopener"); }catch(err){} state.chatErr = ok ? "질문을 복사했어요. 열린 Gemini 창에 붙여 넣고 질문을 이어서 쓰세요." : "복사하지 못했어요. 브라우저 설정에서 복사를 허용해 주세요."; renderChat(true); } break;
    }
  });
  root.addEventListener("input", e => {
    if(e.target.id === "cdraft"){
      state.chatDraft = e.target.value;
      e.target.style.height = "auto"; e.target.style.height = Math.min(120, e.target.scrollHeight) + "px";
    }
  });
  root.addEventListener("keydown", e => {
    if(e.target.id === "cdraft" && e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia && window.matchMedia("(hover:hover)").matches){
      e.preventDefault(); if(!state.chatBusy) chatSend(e.target.value);
    }
  });
}

  fixCancel(){ const s = state.session, q = curQ(); delete s.fixOpen[q.id]; delete s.fixMsg[q.id]; keepScroll(); },
  fixSave(){
    const s = state.session, q = curQ(), f = formOf(q), el = document.getElementById("fixtext");
    if(!el) return;
    const bad = m => { s.fixMsg[q.id] = m; s.fixErr[q.id] = true; keepScroll(); };
    let fx;
    if(f.mode === "text"){
      const lines = linesOf(el.value);
      if(!lines.length) return bad("정답을 한 줄 이상 적어 주세요.");
      if(lines.length > 30 || lines.some(l => l.length > 300)) return bad("정답이 너무 길어요. 30줄, 한 줄 300자 안으로 적어 주세요.");
      fx = {ans: lines};
    } else {
      const key = el.value.split(/[,，\n]/).map(x => x.trim()).filter(Boolean), opts = f.opts.map(o => o.v);
      if(!key.length) return bad("정답을 한 개 이상 적어 주세요.");
      const wrong = key.filter(k => opts.indexOf(k) < 0);
      if(wrong.length) return bad("고를 수 없는 값이에요: " + wrong.join(", ") + ". 고를 수 있는 값은 " + opts.join(", ") + "예요.");
      if(f.mode === "each" && key.length !== f.labels.length) return bad("칸이 " + f.labels.length + "개라서 값도 " + f.labels.length + "개를 적어야 해요.");
      if(f.mode === "pick" && new Set(key).size !== key.length) return bad("같은 값이 두 번 들어갔어요.");
      fx = {key: key, ans: genAnsFromKey(f, key)};
    }
    if(q.ai){ q.ans = fx.ans.slice(); delete FORMS[q.id]; saveAiq(); regradeCurrent(q, "정답을 고쳤어요."); return; }
    ansfix[q.id] = fx; save("ansfix", ansfix); applyFix(q.id);
    regradeCurrent(q, "정답을 고쳤어요.");
  },
  fixRevert(){ const q = curQ(); revertFix(q.id); regradeCurrent(q, "원래 정답으로 되돌렸어요."); },
  fixRevertId(d){ revertFix(d.id); render(); },
  chatOpen(){ state.chatOpen = true; state.chatErr = ""; renderChat(true); },
  aiLink(){
    if(!aiReady()) return;
    const base = location.origin && location.origin !== "null" ? location.origin + location.pathname : location.href.split("#")[0];
    state.aiLink = base + "#aikey=" + encodeURIComponent(ai.key.trim()) + "&aimodel=" + encodeURIComponent(ai.model || AI_DEFAULT_MODEL);
    const ok = copyText(state.aiLink, null);
    state.aiMsg = {err: !ok, t: ok ? "연결 링크를 복사했어요. 폰으로 보내서 열면 키가 저장돼요. 저장한 뒤에는 보낸 메시지를 지워 주세요." : "자동 복사가 안 됐어요. 아래 링크를 길게 눌러 직접 복사해 주세요."};
    render();
  },
  aiShowKey(){ const el = document.getElementById("aikey"); state.aiDraftKey = el ? el.value : ""; state.aiShowKey = !state.aiShowKey; render(); const n = document.getElementById("aikey"); if(n && state.aiDraftKey) n.value = state.aiDraftKey; },
  aiPickModel(d){
    const el = document.getElementById("aikey"), draft = el ? el.value : "";
    ai.model = d.v; state.aiCustom = false; save("ai", ai);
    state.aiMsg = {err: false, t: "모델을 " + d.v + "로 바꿨어요."};
    render(); const n = document.getElementById("aikey"); if(n && draft) n.value = draft;
  },
  aiCustomModel(){
    const el = document.getElementById("aikey"), draft = el ? el.value : "";
    state.aiCustom = true; state.aiMsg = null;
    render(); const n = document.getElementById("aikey"); if(n && draft) n.value = draft;
    const m = document.getElementById("aimodel"); if(m){ try{ m.focus(); }catch(e){} }
  },
  aiSave(){
    const kEl = document.getElementById("aikey");
    const k = (kEl ? kEl.value : "").replace(/^[\s"'`]+|[\s"'`]+$/g, "");
    if(k && !/^[A-Za-z0-9._\-]{20,}$/.test(k)){ state.aiMsg = {err: true, t: "키 모양이 달라요. AI Studio의 'API 키' 칸에 있는 긴 글자 전체를 한 줄로 복사했는지 확인해 주세요. 키는 보통 AQ.로 시작해요. (예전에 만든 키는 AIza로 시작해요.)"}; render(); return; }
    let m = ai.model;
    const mi = document.getElementById("aimodel");
    if(mi){
      const v = mi.value.trim().replace(/^models\//, "");
      if(!v){ state.aiMsg = {err: true, t: "모델 이름을 적어 주세요. 예: gemini-3.8-flash"}; render(); return; }
      if(!MODEL_RE.test(v)){ state.aiMsg = {err: true, t: "모델 이름 모양이 달라요. 소문자, 숫자, 점, 하이픈만 쓰고 공백 없이 적어 주세요."}; render(); return; }
      m = v;
    }
    if(k) ai.key = k;
    ai.model = m; state.aiCustom = !AI_MODELS.some(x => x.id === m) && !!mi; save("ai", ai);
    state.aiMsg = {err: false, t: (k ? "키를 저장했어요. " : "") + "모델은 " + m + "예요." + (k ? " 이어서 '연결 테스트'를 눌러 확인해 보세요." : "")};
    render();
  },
  async aiTest(){
    if(!aiReady()){ state.aiMsg = {err: true, t: "먼저 키를 붙여 넣고 저장해 주세요."}; render(); return; }
    let m = ai.model || AI_DEFAULT_MODEL;
    const mi = document.getElementById("aimodel");
    if(mi && mi.value.trim()){ m = mi.value.trim().replace(/^models\//, ""); if(!MODEL_RE.test(m)){ state.aiMsg = {err: true, t: "모델 이름 모양이 달라요. 소문자, 숫자, 점, 하이픈만 쓰고 공백 없이 적어 주세요."}; render(); return; } ai.model = m; save("ai", ai); }
    state.aiBusy = true; state.aiMsg = null; render();
    const tc = new AbortController(), tm = setTimeout(() => tc.abort(), 20000);
    try{
      const data = await gem("/models/" + encodeURIComponent(m) + ":generateContent", {contents: [{role: "user", parts: [{text: "한국어로 '연결됨' 한 단어만 답해줘."}]}]}, "POST", tc.signal);
      state.aiMsg = {err: false, t: "연결됐어요. 모델 " + m + "의 응답: " + extractText(data).slice(0, 40)};
    }catch(e){ state.aiMsg = {err: true, t: e && e.aborted ? "20초 안에 응답이 오지 않았어요. 키 문제가 아니라 Google 서버가 바쁜 상태로 보여요. 잠시 뒤 다시 시도하거나, 더보기에서 다른 모델을 골라 테스트해 보세요." : errMsg(e)}; }
    clearTimeout(tm);
    state.aiBusy = false; render();
  },
  aiDelKey(){
    if(!confirm("저장된 Gemini 키를 이 기기에서 삭제할까요?")) return;
    ai.key = ""; save("ai", ai); state.aiMsg = {err: false, t: "키를 삭제했어요."}; render();
  }
});

/* =====================================================================
   AI 예상문제 출제
   - 내 Gemini 키로 기출 형식의 새 문제를 만들어요.
   - 만든 문제는 이 기기에 최근 60개까지 저장돼요.
   ===================================================================== */
const CODE_AREAS = AREA_GROUPS[0].areas.slice();
const AIQ_TYPES = [["concept", "개념"], ["code", "코드 해석"], ["fill", "코드 빈칸 채우기"]];
const AIQ_LEVELS = [["easy", "쉽게"], ["normal", "기출 수준"], ["hard", "조금 어렵게"]];
const AIQ_AREAS = AREAS.slice();

function cleanAiq(x){
  if(!x || typeof x.id !== "string" || !/^ai-[a-z0-9-]{3,40}$/.test(x.id) || typeof x.stem !== "string" || !x.stem.trim()) return null;
  const ans = (Array.isArray(x.ans) ? x.ans : []).filter(a => typeof a === "string" && a.trim()).map(a => a.slice(0, 200)).slice(0, 8);
  if(!ans.length) return null;
  const clip = (s, m) => typeof s === "string" ? s.slice(0, m) : "";
  const n = Number.isInteger(x.n) && x.n > 0 ? x.n : 1, seq = Number.isInteger(x.seq) && x.seq > 0 ? x.seq : n;
  return {id: x.id, n: n, seq: seq, area: AREAS.indexOf(LEGACY_AREA[x.area] || x.area) >= 0 ? (LEGACY_AREA[x.area] || x.area) : "SW 개발", type: ["concept", "code", "fill"].indexOf(x.type) >= 0 ? x.type : "concept",
    stem: clip(x.stem, 600), extra: clip(x.extra, 1200), code: clip(x.code, 3000), after: "", ans: ans, expl: clip(x.expl, 1500),
    ai: true, year: 0, round: 0, src: "", label: "AI 예상문제 #" + seq};
}
function saveAiq(){ save("aiq", aiqStore); }
function setAiq(list){
  Object.keys(AIQ).forEach(k => delete AIQ[k]);
  aiqStore = {qs: list.slice(-60), seq: Math.max(aiqStore.seq || 0, 0)};
  aiqStore.qs.forEach(q => { AIQ[q.id] = q; });
  saveAiq();
}
function aiqExamples(o){
  const pool = ALL.filter(q => q.area === o.area && q.type === o.type && !q.img && !q.aimg);
  return shuffle(pool.slice()).slice(0, 2).map((q, i) =>
    "[예시 " + (i + 1) + "]\n문제: " + q.stem + (q.extra ? "\n" + q.extra.slice(0, 600) : "") + (q.code ? "\n코드:\n" + q.code.slice(0, 900) : "") + "\n정답: " + q.ans.join(" / ")).join("\n\n");
}
function buildAiqBody(o){
  const typeName = {concept: "개념(용어나 짧은 답 쓰기)", code: "코드 해석(코드를 읽고 실행 결과 쓰기)", fill: "코드 빈칸 채우기(코드의 빈칸에 들어갈 답 쓰기)"}[o.type];
  const lang = {"C언어": "C언어", Java: "Java", Python: "Python", SQL: "SQL"}[o.area] || o.area;
  const level = {easy: "기출보다 조금 쉽게", normal: "기출과 같은 수준으로", hard: "기출보다 조금 어렵게"}[o.level];
  const sys = "너는 정보처리기사 실기 시험 출제위원이야. 한국어로, 실제 기출 문제와 같은 형식과 말투의 새 문제를 만들어.\n"
    + "출력은 JSON 하나만 써. 설명, 인사말, 코드펜스(```)는 쓰지 마.\n"
    + "형식: {\"questions\":[{\"stem\":\"문제 지시문\",\"code\":\"코드(코드 문제만)\",\"extra\":\"보기나 조건(필요할 때만)\",\"ans\":[\"정답 한 줄씩\"],\"explain\":\"풀이\"}]}\n"
    + "문자열 안의 줄바꿈은 \\n으로 써.";
  const rules = "[규칙]\n"
    + "- 문제는 정확히 " + o.count + "개, 서로 다른 소재로 만들어.\n"
    + "- 실제 기출 문제를 그대로 베끼지 말고 새로 만들어. 그림, 표 이미지, 입력(scanf, input 등)이 필요한 문제는 만들지 마.\n"
    + "- 정답은 하나로 확정되고 짧아야 해. 정답이 여러 칸이면 ans 배열에 \"1. 값\", \"2. 값\"처럼 한 줄씩 써. 코드 출력 문제는 출력되는 줄을 그대로 한 줄씩 써.\n"
    + (o.type === "concept" ? "- 개념 문제의 정답은 용어 1~3개야. 같은 뜻의 다른 표기는 \"A 또는 B\"로 한 줄에 써.\n" : "")
    + (o.type === "code" ? "- 코드는 25줄 이내로 짧게, 출력이 확실한 코드만 써. 코드를 한 줄씩 직접 추적해서 출력을 검증한 뒤 정답을 써. 확신이 없으면 그 문제는 만들지 마.\n" : "")
    + (o.type === "fill" ? "- 코드의 빈칸은 ( 1 ), ( 2 )처럼 표시하고, 정답은 \"1. 값\", \"2. 값\" 형식으로 써. 코드는 25줄 이내로 짧게 써.\n" : "")
    + "- explain에는 정답의 근거를 3~6줄로 써.";
  const ex = aiqExamples(o);
  const user = "영역: " + o.area + (CODE_AREAS.indexOf(o.area) >= 0 ? " (" + lang + ")" : "") + "\n유형: " + typeName + "\n난이도: " + level + "\n문제 수: " + o.count + "\n\n" + (ex ? "[기출 예시]\n" + ex + "\n\n" : "") + rules;
  return {systemInstruction: {parts: [{text: sys}]}, contents: [{role: "user", parts: [{text: user}]}]};
}
function parseAiq(text, o){
  let s = String(text || "").trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim(), obj = null;
  const tryParse = x => { try{ return JSON.parse(x); }catch(e){ return null; } };
  obj = tryParse(s);
  if(obj == null){ const a = s.indexOf("{"), b = s.lastIndexOf("}"); if(a >= 0 && b > a) obj = tryParse(s.slice(a, b + 1)); }
  if(obj == null){ const a = s.indexOf("["), b = s.lastIndexOf("]"); if(a >= 0 && b > a) obj = tryParse(s.slice(a, b + 1)); }
  const arr = Array.isArray(obj) ? obj : (obj && (obj.questions || obj.items)) || [];
  if(!Array.isArray(arr)) return [];
  const clip = (x, m) => typeof x === "string" ? x.slice(0, m) : "";
  return arr.map(it => {
    if(!it || typeof it.stem !== "string" || it.stem.trim().length < 5) return null;
    const ans = (Array.isArray(it.ans) ? it.ans : typeof it.ans === "string" ? it.ans.split("\n") : []).map(x => String(x).trim()).filter(Boolean).slice(0, 8).map(x => x.slice(0, 200));
    if(!ans.length) return null;
    const code = clip(it.code, 3000).replace(/\s+$/, "");
    if((o.type === "code" || o.type === "fill") && !code) return null;
    return {stem: clip(it.stem.trim(), 600), extra: clip(it.extra, 1200).trim(), code: o.type === "concept" ? "" : code, ans: ans, expl: clip(it.explain || it.expl, 1500).trim()};
  }).filter(Boolean).slice(0, o.count);
}
async function aiqGenerate(){
  if(state.aiqBusy) return;
  if(!aiReady()){ state.aiqErr = "먼저 더보기에서 Gemini 키를 설정해 주세요."; render(); return; }
  const o = Object.assign({}, state.aiq), ctrl = new AbortController();
  state.aiqAbort = ctrl; state.aiqBusy = true; state.aiqErr = ""; state.aiqNote = ""; render();
  try{
    const r = await withRetry(async model => {
      const data = await gem("/models/" + encodeURIComponent(model) + ":generateContent", buildAiqBody(o), "POST", ctrl.signal);
      const items = parseAiq(extractText(data), o);
      if(!items.length){ const er = new Error("parse"); er.parse = true; er.retry = true; throw er; }
      return items;
    }, {
      models: modelChain(ai.model), signal: ctrl.signal,
      onWait: w => { state.aiqNote = w.status ? waitText(w) : "문제 형식이 맞지 않아서 다시 만드는 중이에요 (" + w.attempt + "/" + w.max + ")"; render(); },
      onSwitch: m => { state.aiqNote = "서버가 계속 바빠서 " + m + " 모델로 바꿔서 시도해요"; render(); }
    });
    const items = r.value;
    const base = (aiqStore.seq || 0), stamp = Date.now().toString(36);
    const qs = items.map((it, i) => cleanAiq(Object.assign({id: "ai-" + stamp + "-" + (i + 1), n: i + 1, seq: base + i + 1, area: o.area, type: o.type}, it, {expl: it.expl})));
    const good = qs.filter(Boolean);
    if(!good.length) throw Object.assign(new Error("parse"), {parse: true});
    aiqStore = {qs: aiqStore.qs.concat(good).slice(-60), seq: base + good.length};
    Object.keys(AIQ).forEach(k => delete AIQ[k]);
    aiqStore.qs.forEach(q => { AIQ[q.id] = q; });
    saveAiq();
    state.aiqBusy = false; state.aiqAbort = null; state.aiqNote = "";
    newSession(good.map(q => AIQ[q.id] || q), 0, "AI 예상문제"); render();
  }catch(e){
    if(!(e && e.aborted)) state.aiqErr = e && e.parse ? "AI가 문제를 올바른 형식으로 만들지 못했어요. 한 번 더 시도해 주세요." : errMsg(e);
    state.aiqBusy = false; state.aiqAbort = null; state.aiqNote = ""; render();
  }
}
function aiChip(act, v, label, on, disabled){
  return '<button class="chip" data-act="' + act + '" data-v="' + v + '" aria-pressed="' + (on ? "true" : "false") + '" ' + (disabled ? "disabled" : "") + '>' + esc(label) + '</button>';
}
function panelAi(){
  const o = state.aiq, codeOk = CODE_AREAS.indexOf(o.area) >= 0, n = aiqStore.qs.length;
  let h = "";
  if(state.aiqErr) h += '<div class="dmsg err">' + esc(state.aiqErr) + '</div>';
  if(state.aiqBusy) h += '<div class="dmsg">AI가 문제를 만들고 있어요. 10~30초쯤 걸려요. 이 화면을 그대로 두세요.' + (state.aiqNote ? '<br><b>' + esc(state.aiqNote) + '</b>' : '') + '<div style="margin-top:8px"><button class="btn sm" data-act="aiqCancel">취소</button></div></div>';
  if(!aiReady()){
    h += cardSec("AI 출제는 Gemini 키가 필요해요", '<p class="note">내 Gemini 키로 기출 형식의 새 문제를 만들어요. 키는 더보기에서 한 번만 설정하면 돼요. 무료로 만들 수 있고 2분이면 돼요.</p><div class="drow"><button class="btn sm primary" data-act="aiqSetup">키 설정하러 가기</button></div>');
  } else {
    h += cardSec("AI 예상문제", '<p class="note" style="margin:0">내 Gemini 키로 기출 형식의 새 문제를 만들어요. AI가 만든 문제는 정답이 틀릴 수 있어서 따로 표시해요. 코드 문제의 출력은 직접 확인해 보세요.</p>');
  }
  h += cardSec("영역", AREA_GROUPS.map(g => '<div class="grp"><h3>' + g.name + '</h3><div class="chips">' + g.areas.map(a => aiChip("aiqArea", esc(a), a, o.area === a, false)).join("") + '</div></div>').join(""));
  h += cardSec("유형", '<div class="chips">' + AIQ_TYPES.map(t => aiChip("aiqType", t[0], t[1], o.type === t[0], t[0] !== "concept" && !codeOk)).join("") + '</div>'
    + (codeOk ? "" : '<p class="note" style="margin:10px 0 0">코드 유형은 C, Java, Python, SQL 영역에서만 고를 수 있어요.</p>'));
  h += cardSec("문제 수", '<div class="chips">' + [3, 5, 10].map(c => aiChip("aiqCount", c, c + "문제", o.count === c, false)).join("") + '</div>');
  h += cardSec("난이도", '<div class="chips">' + AIQ_LEVELS.map(l => aiChip("aiqLevel", l[0], l[1], o.level === l[0], false)).join("") + '</div>');
  h += cardSec("이전에 만든 예상문제 (" + n + ")", n
    ? '<p class="note">최근 60개까지 이 기기에 저장돼요.</p><div class="drow"><button class="btn sm primary" data-act="aiqPlay">저장된 문제 풀기</button><button class="btn sm danger" data-act="aiqClear">전부 지우기</button></div>'
    : '<p class="note" style="margin:0">아직 없어요.</p>');
  return h;
}
Object.assign(actions, {
  aiqArea(d){ state.aiq.area = d.v; if(CODE_AREAS.indexOf(d.v) < 0) state.aiq.type = "concept"; render(); },
  aiqType(d){ state.aiq.type = d.v; render(); },
  aiqCount(d){ state.aiq.count = +d.v; render(); },
  aiqLevel(d){ state.aiq.level = d.v; render(); },
  aiqGen(){ aiqGenerate(); },
  aiqCancel(){ if(state.aiqAbort) state.aiqAbort.abort(); },
  aiqSetup(){ state.screen = "data"; state.dataMsg = null; render(); try{ window.scrollTo(0, 0); }catch(e){} },
  aiqPlay(){ const l = aiqStore.qs.slice().reverse(); if(l.length){ newSession(l, 0, "AI 예상문제"); render(); } },
  aiqClear(){ if(!confirm("AI가 만든 예상문제를 모두 지울까요?")) return; setAiq([]); render(); },
  resumeGo(){
    const r = resumeInfo();
    if(!r) return;
    newSession(r.list, r.i, resume.label);
    const s = state.session, inList = id => r.list.some(q => q.id === id);
    const pick = (src, dst) => { Object.keys(src || {}).forEach(id => { if(inList(id)) dst[id] = src[id]; }); };

/* ---------- 스케줄링 ---------- */
function parseProcs(text){
  const lines = String(text).split("\n").map(l => l.trim()).filter(Boolean);
  if(!lines.length) throw new Error("프로세스를 한 줄에 하나씩 적어 주세요. 예: P1 0 8");
  if(lines.length > 12) throw new Error("프로세스는 12개까지만 계산해요.");
  const names = new Set();
  return lines.map((l, i) => {
    const t = l.split(/[\s,]+/);
    if(t.length < 3 || !/^\d+$/.test(t[1]) || !/^\d+$/.test(t[2])) throw new Error((i + 1) + "번째 줄을 확인해 주세요. '이름 도착시간 실행시간' 형식이에요. 예: P1 0 8");
    if(names.has(t[0])) throw new Error("이름이 겹쳐요: " + t[0]);
    names.add(t[0]);
    if(+t[2] <= 0) throw new Error(t[0] + "의 실행시간은 1 이상이어야 해요.");
    if(+t[1] > 1000 || +t[2] > 1000) throw new Error("시간은 1000 이하로 적어 주세요.");

  });
}

      const p = av[0]; cur = p.name;

/* ---------- 페이지 교체 ---------- */
function parseRefs(s){
  s = String(s).trim();
  if(!s) throw new Error("페이지 참조 순서를 적어 주세요. 예: 7 0 1 2 0 3");
  const a = /[\s,]/.test(s) ? s.split(/[\s,]+/).filter(Boolean) : s.split("");
  if(a.length > 40) throw new Error("참조 순서는 40개까지만 계산해요.");
  if(a.some(x => x.length > 3)) throw new Error("페이지 번호는 3글자 이하로 적어 주세요.");
  return a;
}
function pageSim(refs, nf, algo){
  const frames = [], steps = [];
  let faults = 0;
  refs.forEach((r, i) => {
    const hit = frames.find(f => f.p === r);
    let victim = null;
    if(hit){ hit.last = i; hit.cnt++; }
    else {
      faults++;
      const nw = {p: r, load: i, last: i, cnt: 1};
      if(frames.length < nf) frames.push(nw);
      else {
        let vi = 0;
        const nextUse = p => { for(let j = i + 1; j < refs.length; j++) if(refs[j] === p) return j; return Infinity; };
        const better = (a, b) => {
          if(algo === "fifo") return a.load < b.load;
          if(algo === "lru") return a.last < b.last;
          if(algo === "lfu") return a.cnt < b.cnt || (a.cnt === b.cnt && a.load < b.load);
          const na = nextUse(a.p), nb = nextUse(b.p);
          return na > nb || (na === nb && a.load < b.load);
        };
        frames.forEach((f, k) => { if(k !== vi && better(f, frames[vi])) vi = k; });
        victim = frames[vi].p; frames[vi] = nw;
      }
    }
    steps.push({ref: r, frames: frames.map(f => f.p), hit: !!hit, victim: victim});
  });
  return {steps: steps, faults: faults, hits: refs.length - faults};
}
function pageHTML(inp){
  const refs = parseRefs(inp.ref), nf = parseInt(inp.frames, 10);
  if(!(nf >= 1 && nf <= 8)) throw new Error("프레임 수는 1~8개로 적어 주세요.");
  const r = pageSim(refs, nf, inp.algo), name = {fifo: "FIFO", lru: "LRU", lfu: "LFU", opt: "OPT(최적)"}[inp.algo];
  let h = '<div class="tscroll"><table class="ttbl pg"><thead><tr><th>참조</th>' + r.steps.map(s => '<th>' + esc(s.ref) + '</th>').join("") + '</tr></thead><tbody>';
  for(let k = 0; k < nf; k++) h += '<tr><th>프레임 ' + (k + 1) + '</th>' + r.steps.map(s => '<td' + (s.frames[k] === undefined ? ' class="em"' : '') + '>' + (s.frames[k] === undefined ? '-' : esc(s.frames[k])) + '</td>').join("") + '</tr>';
  h += '<tr><th>결과</th>' + r.steps.map(s => '<td class="' + (s.hit ? "hit" : "flt") + '">' + (s.hit ? "H" : "F") + '</td>').join("") + '</tr></tbody></table></div>';
  h += '<p class="resline">' + name + ', 프레임 ' + nf + '개: 페이지 부재(F) <b>' + r.faults + '번</b>, 적중(H) ' + r.hits + '번, 적중률 ' + Math.round(r.hits / refs.length * 100) + '%</p>'
    + '<p class="note">' + ({fifo: "FIFO: 가장 먼저 들어온 페이지를 교체해요.", lru: "LRU: 가장 오랫동안 쓰이지 않은 페이지를 교체해요. 적중하면 최근 사용으로 갱신돼요.", lfu: "LFU: 사용 횟수가 가장 적은 페이지를 교체해요. 횟수가 같으면 먼저 들어온 페이지를 교체해요.", opt: "OPT: 앞으로 가장 늦게 쓰일 페이지를 교체해요. 비교 기준용 이상적인 방법이에요."}[inp.algo]) + ' 처음 빈 프레임이 채워지는 것도 부재(F)로 세요.</p>';
  return h;
}

/* ---------- 테스트 커버리지 (조건/결정) ---------- */
function parseBool(src){
  const toks = [];

  s = s.replace(/&&/g, "&").replace(/\|\|/g, "|");
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(/\s/.test(c)) continue;
    if(c === "&" || c === "|" || c === "!" || c === "(" || c === ")") toks.push(c);
    else if(/[A-Za-z]/.test(c)) toks.push({v: c.toUpperCase()});
    else throw new Error("사용할 수 없는 글자가 있어요: " + c + " (조건은 A, B, C 같은 영문자, 연산자는 &&, ||, ! 를 써요)");
  }
  let pos = 0;
  const peek = () => toks[pos], next = () => toks[pos++];
  const pOr = () => { let l = pAnd(); while(peek() === "|"){ next(); l = {op: "or", l: l, r: pAnd()}; } return l; };
  const pAnd = () => { let l = pNot(); while(peek() === "&"){ next(); l = {op: "and", l: l, r: pNot()}; } return l; };
  const pNot = () => { if(peek() === "!"){ next(); return {op: "not", e: pNot()}; } return pAtom(); };
  const pAtom = () => {
    const t = next();
    if(t === undefined) throw new Error("식이 중간에 끝났어요. 괄호나 조건이 빠졌는지 확인해 주세요.");
    if(t === "("){ const e = pOr(); if(next() !== ")") throw new Error("닫는 괄호 ) 가 빠졌어요."); return e; }
    if(t && t.v) return {op: "var", v: t.v};
    throw new Error("식을 읽을 수 없어요. 연산자 위치를 확인해 주세요.");
  };
  if(!toks.length) throw new Error("조건식을 적어 주세요. 예: A && (B || C)");
  const ast = pOr();
  if(pos < toks.length) throw new Error("식의 끝이 이상해요. 연산자나 괄호를 확인해 주세요.");
  const vars = [];
  (function walk(n){ if(n.op === "var"){ if(vars.indexOf(n.v) < 0) vars.push(n.v); } else { if(n.l) walk(n.l); if(n.r) walk(n.r); if(n.e) walk(n.e); } })(ast);
  vars.sort();
  if(vars.length > 5) throw new Error("조건은 5개까지만 계산해요.");
  const ev = (n, a) => n.op === "var" ? a[n.v] : n.op === "not" ? !ev(n.e, a) : n.op === "and" ? ev(n.l, a) && ev(n.r, a) : ev(n.l, a) || ev(n.r, a);
