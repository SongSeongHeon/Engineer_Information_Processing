}
function coverageAnalyze(src){
  const P = parseBool(src), n = P.vars.length, N = Math.pow(2, n), rows = [];
  for(let i = 0; i < N; i++){
    const a = {}; P.vars.forEach((v, k) => { a[v] = !!((N - 1 - i) >> (n - 1 - k) & 1); });
    rows.push({i: i, a: a, r: P.ev(P.ast, a)});
  }
  const flip = (i, k) => i ^ (1 << (n - 1 - k));   // k번째 조건만 바꾼 행 번호(i는 0부터)
  const pairs = P.vars.map((v, k) => { const l = []; for(let i = 0; i < N; i++){ const j = flip(i, k); if(i < j && rows[i].r !== rows[j].r) l.push([i, j]); } return l; });
  const subsets = (size, test) => {
    const idx = [];
    const rec = (start) => {
      if(idx.length === size) return test(idx) ? idx.slice() : null;
      for(let x = start; x < N; x++){ idx.push(x); const f = rec(x + 1); idx.pop(); if(f) return f; }
      return null;
    };
    return rec(0);
  };
  const find = (test, from, to) => { for(let s = from; s <= Math.min(to, N); s++){ const f = subsets(s, test); if(f) return f; } return null; };
  const okDecision = set => set.some(i => rows[i].r) && set.some(i => !rows[i].r);
  const okCond = set => P.vars.every(v => set.some(i => rows[i].a[v]) && set.some(i => !rows[i].a[v]));
  const out = {vars: P.vars, rows: rows, pairs: pairs, N: N};
  out.decision = find(okDecision, 2, 2);
  out.condition = find(okCond, 2, 2);
  out.condDecision = find(s => okDecision(s) && okCond(s), 2, N);
  const mcdc = set => pairs.every(pl => pl.some(pp => set.indexOf(pp[0]) >= 0 && set.indexOf(pp[1]) >= 0));
  out.mcdc = pairs.every(pl => pl.length) ? find(mcdc, n + 1, N) : null;
  out.tautology = rows.every(r => r.r) || rows.every(r => !r.r);
  return out;
}
function coverHTML(inp){
  const c = coverageAnalyze(inp.expr), tf = b => b ? "T" : "F";
  const tc = (set, title, note) => {
    if(!set) return '<tr><th>' + title + '</th><td colspan="2">해당하는 테스트 케이스를 만들 수 없어요.</td></tr>';
    return '<tr><th>' + title + '</th><td><b>' + set.length + '개</b></td><td>' + set.map(i => '#' + (i + 1)).join(", ") + (note ? '<br><small>' + note + '</small>' : '') + '</td></tr>';
  };
  let h = '<div class="tscroll"><table class="ttbl pg"><thead><tr><th>#</th>' + c.vars.map(v => '<th>' + v + '</th>').join("") + '<th>결과</th></tr></thead><tbody>'
    + c.rows.map(r => '<tr><th>' + (r.i + 1) + '</th>' + c.vars.map(v => '<td class="' + (r.a[v] ? "hit" : "flt") + '">' + tf(r.a[v]) + '</td>').join("") + '<td><b>' + tf(r.r) + '</b></td></tr>').join("") + '</tbody></table></div>';
  if(c.tautology) h += '<p class="note" style="color:var(--bad)">이 식은 항상 같은 결과라서 결정 커버리지를 만족하는 테스트 케이스를 만들 수 없어요.</p>';
  h += '<h3 class="mini">기준별 최소 테스트 케이스</h3><div class="tscroll"><table class="ttbl"><thead><tr><th>기준</th><th>최소 개수</th><th>예 (위 표의 행 번호)</th></tr></thead><tbody>'
    + tc(c.decision, "결정(분기) 커버리지", "결정의 결과가 참과 거짓을 모두 가져요.")
    + tc(c.condition, "조건 커버리지", "모든 조건이 참과 거짓을 모두 가져요. (결과는 한쪽만 나올 수도 있어요.)")
    + tc(c.condDecision, "조건/결정 커버리지", "조건과 결정이 모두 참과 거짓을 가져요.")
    + tc(c.mcdc, "변경 조건/결정 (MC/DC)", "각 조건이 다른 조건은 그대로 둔 채 혼자서 결과를 바꾸는 쌍이 들어 있어요.")
    + '<tr><th>다중 조건 커버리지</th><td><b>' + c.N + '개</b></td><td>모든 조합 (2^' + c.vars.length + ')</td></tr></tbody></table></div>';
  h += '<h3 class="mini">MC/DC 독립 쌍</h3><p class="note">한 조건만 바뀌었는데 결과가 달라지는 두 행이에요. 모든 조건이 쌍을 하나씩 가져야 해요.</p><table class="ttbl"><tbody>'
    + c.vars.map((v, k) => '<tr><th>' + v + '</th><td>' + (c.pairs[k].length ? c.pairs[k].map(p => '(#' + (p[0] + 1) + ', #' + (p[1] + 1) + ')').join("  ") : '없음 (이 조건은 결과에 영향을 못 줘요)') + '</td></tr>').join("") + '</tbody></table>';
  return h;
}

function toolResHTML(kind){
  const i = state.toolIn[kind];
  try{
    if(kind === "subnet") return subnetHTML(i);
    if(kind === "sched") return schedHTML(i);
    if(kind === "page") return pageHTML(i);

}
function toolField(kind, key, label, ph, opts){
  const v = state.toolIn[kind][key];

  return '<div class="fld"><label>' + label + '</label>' + (opts.area
    ? '<textarea data-tool="' + kind + '" data-k="' + key + '" rows="' + opts.area + '" spellcheck="false" autocapitalize="off" style="width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:15px/1.6 var(--mono)">' + esc(v) + '</textarea>'
    : '<input type="text" data-tool="' + kind + '" data-k="' + key + '" value="' + esc(v) + '" placeholder="' + esc(ph || "") + '" autocomplete="off" autocapitalize="off" spellcheck="false"' + (opts.num ? ' inputmode="numeric"' : '') + '>') + '</div>';
}
function panelTools(){
  const k = state.tool, i = state.toolIn[k];
  let h = '<div class="chips" style="margin:0 0 12px">' + TOOLS.map(t => chip("setTool", 'data-v="' + t[0] + '"', t[1], k === t[0])).join("") + '</div>';

Object.assign(actions, {
  setTool(d){ state.tool = d.v; render(); },
  setToolAlgo(d){ state.toolIn[state.tool].algo = d.v; render(); },
  setToolExpr(d){ state.toolIn.cover.expr = d.v; render(); }
});

const $app = document.getElementById("app");
$app.addEventListener("click", e => {
  const cl = e.target.closest(".cl");
  if(cl){ cl.classList.toggle("on"); return; }
  const el = e.target.closest("[data-act]");
  if(!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if(fn) fn(el.dataset, el);
});
$app.addEventListener("input", e => {
  const el = e.target, ds = el.dataset || {};
  if(ds.inp !== undefined && state.session){ getInp(curQ().id).t[+ds.i] = el.value; }
  else if(ds.calc !== undefined && state.session){
    const q = curQ(), v = el.value;
    if(v.trim()) calc[q.id] = v; else delete calc[q.id];
    save("calc", calc); calcFit(el);
    const cs = $app.querySelector(".calc-h .cs");
    if(cs){ const n = v.split("\n").filter(l => l.trim()).length; cs.textContent = n ? n + "줄 적음" : "비어 있음"; }
  }
  else if(ds.memo !== undefined && state.session){
    const q = curQ(), v = el.value;
    if(v.trim()) notes[q.id] = v; else delete notes[q.id];
    delete HAY[q.id]; save("notes", notes); calcFit(el);
  }
  else if(ds.tool !== undefined){
    state.toolIn[ds.tool][ds.k] = el.value;
    const box = document.getElementById("toolres");
    if(box) box.innerHTML = toolResHTML(ds.tool);
  }
  else if(ds.search !== undefined){
    state.q = el.value;
    const box = document.getElementById("sresults");
    if(box) box.innerHTML = resultsHTML();
  }
});
$app.addEventListener("change", e => {
  const el = e.target, ds = el.dataset || {};
  if(ds.setting === "ln"){ settings.ln = el.checked; save("settings", settings); }
  else if(ds.ai === "hint" || ds.ai === "img" || ds.ai === "fallback"){ ai[ds.ai] = el.checked; save("ai", ai); }
  else if(ds.file === "import" && el.files && el.files[0]){
    const fr = new FileReader();
    fr.onload = () => {
      if(!confirm("지금 기록이 불러온 파일의 내용으로 바뀌어요. 계속할까요?")) return;
      const r = importText(String(fr.result || "")); state.dataMsg = r.msg; state.dataErr = !r.ok; render();
    };
    fr.readAsText(el.files[0]);
  }
});
$app.addEventListener("keydown", e => {
  const el = e.target;
  if(el.dataset && el.dataset.inp !== undefined && e.key === "Enter"){
    if(el.tagName === "TEXTAREA" && !(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    actions.check();
  }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && state.chatOpen){ state.chatOpen = false; renderChat(true); return; }
  if(e.key === "Escape" && state.navOpen){ actions.navClose(); return; }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const onBtn = tag === "BUTTON" || tag === "A";
  if(state.screen === "solve"){
    const s = state.session, q = curQ(), st = s.st[q.id];
    if(e.key === "ArrowRight") actions.next();
    else if(e.key === "ArrowLeft") actions.prev();
    else if(e.key === "Enter" && !onBtn){ if(st) actions.next(); else actions.check(); e.preventDefault(); }
    else if(st && (e.key === "o" || e.key === "O")) actions.grade({v:"o"});
    else if(st && (e.key === "x" || e.key === "X")) actions.grade({v:"x"});
  } else if(state.screen === "card"){
    const c = state.cs;
    if((e.key === "Enter" || e.key === " ") && !onBtn){ if(!c.flip) actions.cardFlip(); e.preventDefault(); }
    else if(c.flip && (e.key === "o" || e.key === "O")) actions.cardMark({v:"k"});
    else if(c.flip && (e.key === "x" || e.key === "X")) actions.cardMark({v:"u"});
    else if(e.key === "ArrowLeft") actions.cardPrev();
  }
});
